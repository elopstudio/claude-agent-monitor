<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에이전트 관제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f7; --bg-grad:#e7ebf5; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e0e3ea; --line-strong:#c8cdd8;
  --text:#171a21; --muted:#5b6372; --faint:#8d95a3;
  --accent:#3a63d8; --accent-soft:#e9eefc;
  --run:#3a63d8; --run-soft:#e9eefc;
  --wait:#8c6a10; --wait-soft:#f7f0dc;
  --block:#b0341f; --block-soft:#fae8e3;
  --done:#4a5260; --done-soft:#eceef2;
  --bubble:#ffffff; --floor:#eef0f6; --shadow:rgba(20,28,48,.08); --bot-shadow:rgba(20,28,48,.16);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
    --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
    --accent:#86a6f5; --accent-soft:#1d2741;
    --run:#86a6f5; --run-soft:#1d2741;
    --wait:#e0bc5e; --wait-soft:#2f2816;
    --block:#f0907d; --block-soft:#3b201b;
    --done:#a3abb8; --done-soft:#232830;
    --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
  --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
  --accent:#86a6f5; --accent-soft:#1d2741;
  --run:#86a6f5; --run-soft:#1d2741;
  --wait:#e0bc5e; --wait-soft:#2f2816;
  --block:#f0907d; --block-soft:#3b201b;
  --done:#a3abb8; --done-soft:#232830;
  --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1400px 520px at 50% -140px,var(--bg-grad),transparent 70%),var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:22px 16px 60px}
.mono{font-family:var(--mono)}

/* 머리 */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint);position:relative}
.live.on i{background:var(--run)}
.live.on i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.totals{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 1px 2px var(--shadow)}
.pill b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.pill .g{font-size:10px}
.pill.run b,.pill.run .g{color:var(--run)}
.pill.wait b,.pill.wait .g{color:var(--wait)}
.pill.rest b,.pill.rest .g{color:var(--faint)}

/* 프로젝트 탭 */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin:0 0 -1px;padding:0 4px;position:relative;z-index:1}
.tab{appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:9px 14px 10px 8px;border-radius:12px 12px 0 0;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:700}
.tab svg{width:26px;height:26px;flex:none}
.tab .tname{font-family:var(--mono)}
.tab .tc{display:inline-flex;gap:4px}
.tab .tc span{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.tab .tc .r{color:var(--run);background:var(--run-soft)}
.tab .tc .w{color:var(--wait);background:var(--wait-soft)}
.tab .tc .z{color:var(--faint);border:1px dashed var(--line-strong);line-height:15px}

/* 프로젝트 */
.project{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.project>.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.project .folder{font-family:var(--mono);font-weight:700;font-size:16px}
.project .label{color:var(--muted);font-size:12px}
.project .counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-flex;gap:4px;align-items:center}
.cnt.run{color:var(--run);background:var(--run-soft)}
.cnt.wait{color:var(--wait);background:var(--wait-soft)}
.cnt.rest{color:var(--faint);border:1px dashed var(--line-strong)}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}
.pbody.solo{grid-template-columns:minmax(0,1fr)}

/* 조직도 */
.org{min-width:0}
.tree{position:relative;margin:10px 0 0 42px;padding-left:22px;border-left:2px dashed var(--line-strong);display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tree.flat{margin-left:0;padding-left:0;border-left:0}
.tree:not(.flat)>.bot-card::before{content:"";position:absolute;left:-24px;top:50px;width:22px;border-top:2px dashed var(--line-strong)}
.lead-wrap{max-width:640px}
.role-tag{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--wait);background:var(--wait-soft);border-radius:4px;padding:1px 6px}

.bot-card{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 10px;box-shadow:0 1px 2px var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.bot-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--shadow)}
.bot-card.leader{grid-template-columns:100px minmax(0,1fr);border-color:var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.stage{position:relative;height:96px;border-radius:9px;background:var(--floor);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.leader .stage{height:112px}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,rgba(127,137,160,.10))}
.stage .robot{width:72px;height:72px;position:relative;z-index:1;margin-bottom:8px}
.leader .stage .robot{width:88px;height:88px}
.stage .shadow{position:absolute;bottom:7px;left:50%;width:40px;height:6px;margin-left:-20px;border-radius:50%;background:var(--bot-shadow);filter:blur(1px)}
.st-working .stage .shadow{animation:shadow 1.8s ease-in-out infinite}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.7}}
.info{min-width:0;display:flex;flex-direction:column;gap:5px}
.info .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .nm{display:flex;align-items:baseline;gap:6px;min-width:0}
.info .short{font-family:var(--mono);font-weight:700;font-size:15px}
.info .full{font-family:var(--mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .title{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;margin-left:4px;display:flex;gap:7px;align-items:flex-start}
.bubble::before{content:"";position:absolute;left:-6px;top:11px;width:9px;height:9px;background:var(--bubble);border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
.bubble .k{flex:none;font-size:12px;line-height:1.55}
.st-resting .bubble{color:var(--faint);border-style:dashed}
.st-resting .bubble::before{border-left-style:dashed;border-bottom-style:dashed}
.info .when{color:var(--faint);font-size:11px;margin-left:4px;display:flex;gap:8px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge .g{font-size:9px;line-height:1}
.b-run{color:var(--run);background:var(--run-soft)}
.b-wait{color:var(--wait);background:var(--wait-soft)}
.b-block{color:var(--block);background:var(--block-soft);border-color:var(--block)}
.b-done{color:var(--done);background:var(--done-soft)}
.b-rest{color:var(--faint);border-color:var(--line-strong);border-style:dashed}

/* 로봇 — 상태는 색이 아니라 표정·움직임 */
.robot *{transform-box:view-box}
.robot .rb{transform-origin:32px 60px}
.st-working .robot .rb{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.st-working .robot .eyes{transform-origin:32px 28px;animation:blink 4.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.st-working .robot .arm-l{transform-origin:16.5px 47px;animation:type .45s ease-in-out infinite alternate}
.st-working .robot .arm-r{transform-origin:47.5px 47px;animation:type .45s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.st-working .robot .bulb,.st-working .robot .core{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{opacity:.3}}
.st-waiting .robot .rb{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.robot .zz{font:900 9px var(--sans);fill:var(--muted);opacity:0;animation:float 3s ease-in infinite}
.robot .zz.b{animation-delay:1.5s;font-size:7px}
@keyframes float{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.st-resting .robot .rb{filter:grayscale(1);opacity:.5}
@media (prefers-reduced-motion:reduce){.robot *,.live i::after,.stage .shadow{animation:none!important}}

/* 옆 칸 — 팀 대화·작업판 */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--surface)}
.panel>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint)}
.feed{list-style:none;margin:0;padding:6px 0;max-height:360px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:6px 12px}
.feed .who{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
.feed .who svg{width:18px;height:18px}
.feed .arrow{color:var(--faint);font-weight:500}
.feed .s{font-size:12.5px;overflow-wrap:anywhere}
.feed .t{color:var(--faint);font-size:11px}
.empty{color:var(--faint);font-size:12px;padding:12px;text-align:center}

.bcols{display:flex;flex-direction:column;gap:2px;padding:6px 8px 8px}
.bgroup>h4{margin:6px 4px 4px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.bgroup>h4 .n{font-family:var(--mono);color:var(--faint);font-weight:500}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 5px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;position:relative}
.task.blocked{border-color:var(--block);padding-left:13px}
.task.blocked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:8px 0 0 8px;background:repeating-linear-gradient(45deg,var(--block) 0 3px,transparent 3px 6px)}
.task .pos{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .ss{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.task.done{background:transparent;color:var(--muted)}
.more{font-size:11px;color:var(--faint);padding:0 4px 4px}

.notice{margin:0 0 16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px}

@media (max-width:1100px){ .pbody{grid-template-columns:1fr} }
@media (max-width:640px){
  .tree{margin-left:14px;padding-left:14px;grid-template-columns:1fr}
  .tree:not(.flat)>.bot-card::before{left:-16px;width:14px}
  .bot-card,.bot-card.leader{grid-template-columns:76px minmax(0,1fr)}
  .leader .stage .robot{width:72px;height:72px}
  .project .counts{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo st-working" id="logo"></span>
      <div>
        <h1>에이전트 관제</h1>
        <div class="sub"><span class="live" id="live"><i></i><span id="live-text">연결 중</span></span><span id="asof"></span></div>
      </div>
    </div>
    <div class="totals" id="totals"></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="프로젝트"></nav>
  <main id="projects"></main>
</div>

<script>
(() => {
  const POLL_MS = 3000;
  const STATE = {
    working: { label: '작업 중', glyph: '▶', cls: 'b-run' },
    waiting: { label: '대기',   glyph: '○', cls: 'b-wait' },
    resting: { label: '쉬는 중', glyph: '–', cls: 'b-rest' },
  };
  const ACT_ICON = { shell: '⌨', read: '📖', edit: '✎', search: '🔍', talk: '💬', agent: '🤖', web: '🌐', publish: '📋', skill: '🧩', other: '•' };

  /* ── 로봇 ── 색·장식 = 누구인지(이름과 함께), 표정·동작 = 상태 */
  const PALETTE = [
    ['#8fb4ff', '#5b83dc'], ['#86dcb0', '#48a878'], ['#c7a8ff', '#9573dc'], ['#ffb37a', '#dc8243'],
    ['#ff9fb8', '#dc6d8c'], ['#79d6e3', '#43a6b5'], ['#ffd166', '#d9a32a'], ['#b5c46a', '#869636'],
  ];
  const ACCS = ['ball', 'twin', 'phones', 'sprout', 'bolt'];
  function hash(s) { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
  function spec(name, leader) {
    const h = hash(name);
    return { c: leader ? 6 : h % 6, acc: leader ? 'crown' : ACCS[(h >>> 4) % ACCS.length] };
  }
  function accessory(acc, dark) {
    const stem = `stroke="${dark}" stroke-width="2.2" stroke-linecap="round" fill="none"`;
    switch (acc) {
      case 'twin': return `<path d="M25 12 L20 5" ${stem}/><circle class="bulb" cx="20" cy="4.5" r="2.8" fill="#ff7a8a"/><path d="M39 12 L44 5" ${stem}/><circle class="bulb" cx="44" cy="4.5" r="2.8" fill="#ff7a8a"/>`;
      case 'phones': return `<path d="M9 26 C9 3 55 3 55 26" stroke="#3b4252" stroke-width="3.6" fill="none"/>`;
      case 'sprout': return `<path d="M32 12 L32 6.5" ${stem}/><path d="M32 7 C27 7 24.5 4 24.5 1 C29 1 32 3.5 32 7Z" fill="#5cc27f"/><path d="M32 7 C37 7 39.5 4.5 39.5 2 C35 2 32 4 32 7Z" fill="#7ad698"/>`;
      case 'bolt': return `<path d="M33 12 L29.5 8 L34.5 7 L30.5 2.5" stroke="${dark}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none"/><circle class="bulb" cx="30.5" cy="2.5" r="2.2" fill="#ffe066"/>`;
      case 'crown': return `<path d="M21 13 L21 4.5 L26.5 8.5 L32 1.5 L37.5 8.5 L43 4.5 L43 13 Z" fill="#ffcf3f" stroke="#c9961a" stroke-width="1.4" stroke-linejoin="round"/><circle class="bulb" cx="32" cy="9" r="1.8" fill="#ff6b81"/>`;
      default: return `<path d="M32 12 L32 5.5" ${stem}/><circle class="bulb" cx="32" cy="4.5" r="3" fill="#ff7a8a"/>`;
    }
  }
  function face(st) {
    const eye = '#aef3ff';
    const line = `stroke="${eye}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
    if (st === 'waiting') return `<path d="M22 28 Q25 30.5 28 28" ${line}/><path d="M36 28 Q39 30.5 42 28" ${line}/><circle cx="32" cy="34" r="1.5" fill="${eye}"/>`;
    if (st === 'resting') return `<path d="M22 28 L28 28" stroke="#7b8594" stroke-width="2.2" stroke-linecap="round"/><path d="M36 28 L42 28" stroke="#7b8594" stroke-width="2.2" stroke-linecap="round"/><path d="M30 34 L34 34" stroke="#7b8594" stroke-width="1.6" stroke-linecap="round"/>`;
    return `<g class="eyes"><ellipse cx="25" cy="27.5" rx="3.1" ry="3.9" fill="${eye}"/><ellipse cx="39" cy="27.5" rx="3.1" ry="3.9" fill="${eye}"/><circle cx="26.2" cy="26" r="1.1" fill="#fff"/><circle cx="40.2" cy="26" r="1.1" fill="#fff"/></g><path d="M28.5 33 Q32 36.2 35.5 33" stroke="${eye}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  }
  function robotSvg(name, st, leader, mini) {
    const s = spec(name, leader), [body, dark] = PALETTE[s.c];
    const ears = s.acc === 'phones'
      ? `<rect x="2.5" y="19" width="9" height="16" rx="4" fill="#3b4252"/><rect x="52.5" y="19" width="9" height="16" rx="4" fill="#3b4252"/>`
      : `<rect x="4" y="23" width="5" height="11" rx="2.2" fill="${dark}"/><rect x="55" y="23" width="5" height="11" rx="2.2" fill="${dark}"/>`;
    const lower = mini ? '' : `<rect class="arm-l" x="14" y="46" width="5" height="10" rx="2.5" fill="${body}"/><rect class="arm-r" x="45" y="46" width="5" height="10" rx="2.5" fill="${body}"/><rect x="20" y="44.5" width="24" height="14.5" rx="5.5" fill="${dark}"/><rect x="26" y="48.5" width="12" height="6.5" rx="2.2" fill="#1d2230"/><circle class="core" cx="32" cy="51.75" r="1.7" fill="#aef3ff"/>`;
    const zz = !mini && st === 'waiting' ? `<text class="zz" x="49" y="12">z</text><text class="zz b" x="54" y="7">z</text>` : '';
    return `<svg class="robot" viewBox="${mini ? '1 0 62 46' : '0 0 64 64'}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="rb">${lower}${accessory(s.acc, dark)}${ears}<rect x="8" y="12" width="48" height="32" rx="12" fill="${body}"/><rect x="13" y="14.6" width="13" height="3" rx="1.5" fill="#fff" opacity=".4"/><rect x="14" y="19" width="36" height="19.5" rx="8" fill="#1d2230"/><circle cx="18.6" cy="34.5" r="2.3" fill="#ff8fa8" opacity=".5"/><circle cx="45.4" cy="34.5" r="2.3" fill="#ff8fa8" opacity=".5"/>${face(st)}</g>${zz}</svg>`;
  }
  function robotNode(name, st, leader, mini) {
    const t = document.createElement('template');
    t.innerHTML = robotSvg(name, st, leader, mini).trim();   // 정적 도형만 — 데이터 문자열은 넣지 않는다
    return t.content.firstChild;
  }

  /* ── 도우미 ── */
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  const str = (v) => (typeof v === 'string' ? v : v == null ? '' : String(v));
  function ago(ms) {
    if (!ms) return '';
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분';
    const h = Math.floor(m / 60);
    if (h < 24) return h + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '');
    return Math.floor(h / 24) + '일';
  }
  function badge(st) { const s = STATE[st] || STATE.resting; const b = el('span', 'badge ' + s.cls); b.append(el('span', 'g', s.glyph), document.createTextNode(s.label)); return b; }
  let selected = decodeURIComponent(location.hash.slice(1)) || (() => { try { return localStorage.getItem('am.tab') || ''; } catch (e) { return ''; } })();
  let last = null, box0Key = '';
  function select(key) {
    selected = key;
    try { localStorage.setItem('am.tab', key); } catch (e) {}
    history.replaceState(null, '', '#' + encodeURIComponent(key));
    if (last) render(last);
  }

  /* ── 카드 ── */
  function botCard(s, projectKey) {
    const st = STATE[s.state] ? s.state : 'resting';
    const card = el('div', 'bot-card st-' + st + (s.isLeader ? ' leader' : ''));
    const stage = el('div', 'stage');
    stage.setAttribute('role', 'img');
    stage.setAttribute('aria-label', str(s.name) + ' ' + STATE[st].label);
    stage.append(el('span', 'shadow'), robotNode(str(s.name), st, s.isLeader, false));
    const info = el('div', 'info');
    const row = el('div', 'row');
    const nm = el('div', 'nm');
    nm.append(el('span', 'short', str(s.short) || str(s.name)));
    if (s.isLeader) nm.append(el('span', 'role-tag', '리더'));
    nm.title = str(s.name);
    row.append(nm, badge(st));
    info.append(row);
    if (s.role) info.append(el('div', 'title', str(s.role)));
    const bubble = el('div', 'bubble');
    if (s.activity && st === 'working') {
      bubble.append(el('span', 'k', ACT_ICON[s.activity.kind] || '•'), el('span', null, str(s.activity.text)));
    } else if (s.activity) {
      bubble.append(el('span', 'k', '⏸'), el('span', null, '마지막 · ' + str(s.activity.text)));
    } else {
      bubble.append(el('span', null, st === 'resting' ? '쉬는 중' : '대기 중'));
    }
    info.append(bubble);
    const when = el('div', 'when');
    when.append(el('span', null, STATE[st].label + ' ' + ago(s.statusSince) + (st === 'working' ? '째' : ' 전부터')));
    if (s.startedAt) when.append(el('span', null, '켜진 지 ' + ago(s.startedAt)));
    info.append(when);
    card.append(stage, info);
    return card;
  }

  function feedPanel(p) {
    const panel = el('section', 'panel');
    const h = el('h3', null, '💬 팀 대화');
    h.append(el('span', 'n', String(p.messages.length)));
    panel.append(h);
    if (!p.messages.length) { panel.append(el('div', 'empty', '최근 메시지 없음')); return panel; }
    const leaderName = p.leader;
    const shortOf = (n) => { const x = str(n); return x.toLowerCase().startsWith(p.key + '-') ? x.slice(p.key.length) : x; };
    const ul = el('ul', 'feed');
    for (const m of p.messages) {
      const li = el('li');
      const who = el('span', 'who');
      who.append(robotNode(str(m.from), 'working', m.from === leaderName, true), document.createTextNode(shortOf(m.from)), el('span', 'arrow', '→'), document.createTextNode(shortOf(m.to)));
      const body = el('div');
      body.append(el('div', 's', str(m.summary) || '(요약 없음)'), el('div', 't', ago(m.at) + (ago(m.at) === '방금' ? '' : ' 전')));
      li.append(who, body);
      ul.append(li);
    }
    panel.append(ul);
    return panel;
  }

  function boardPanel(p) {
    const b = p.board;
    const panel = el('section', 'panel');
    const h = el('h3', null, '📋 작업판');
    if (b.updatedAt) h.append(el('span', 'n', ago(Date.parse(b.updatedAt)) + ' 전 갱신'));
    panel.append(h);
    const tasks = Array.isArray(b.tasks) ? b.tasks : [];
    const box = el('div', 'bcols');
    const group = (title, items, withPos, limit) => {
      const g = el('div', 'bgroup');
      const hh = el('h4', null, title); hh.append(el('span', 'n', String(items.length)));
      g.append(hh);
      let q = 0;
      for (const t of items.slice(0, limit)) {
        const st = str(t.status);
        const row = el('div', 'task' + (st === 'blocked' ? ' blocked' : '') + (st === 'done' ? ' done' : ''));
        if (withPos && st === 'queued') row.append(el('span', 'pos', String(++q)));
        row.append(el('span', 'tt', (st === 'done' ? '✓ ' : st === 'blocked' ? '■ ' : '') + str(t.title)));
        if (t.session) row.append(el('span', 'ss', str(t.session)));
        g.append(row);
      }
      if (items.length > limit) g.append(el('div', 'more', '외 ' + (items.length - limit) + '건'));
      if (!items.length) g.append(el('div', 'more', '없음'));
      return g;
    };
    const time = (v) => Date.parse(str(v)) || 0;
    box.append(
      group('▶ 진행 중', tasks.filter((t) => t.status === 'running'), false, 8),
      group('○ 대기', tasks.filter((t) => t.status === 'queued' || t.status === 'blocked')
        .sort((a, c) => (a.status === 'blocked') - (c.status === 'blocked') || (Number(a.order) || 999) - (Number(c.order) || 999)), true, 8),
      group('✓ 완료', tasks.filter((t) => t.status === 'done').sort((a, c) => time(c.doneAt) - time(a.doneAt)), false, 5),
    );
    const dec = (Array.isArray(b.decisions) ? b.decisions : []).filter((d) => d.status !== 'closed');
    if (dec.length) box.append(group('? 결정 대기', dec.map((d) => ({ title: d.title, status: 'queued', order: d.order })).sort((a, c) => a.order - c.order), true, 8));
    panel.append(box);
    return panel;
  }

  function projectNode(p) {
    const det = el('section', 'project');
    det.setAttribute('role', 'tabpanel');
    const sum = el('div', 'phead');
    sum.append(el('span', 'folder', p.key));
    if (p.label) sum.append(el('span', 'label', p.label));
    const counts = el('span', 'counts');
    if (p.counts.working) counts.append(el('span', 'cnt run', '▶ 작업 중 ' + p.counts.working));
    if (p.counts.waiting) counts.append(el('span', 'cnt wait', '○ 대기 ' + p.counts.waiting));
    if (p.counts.resting) counts.append(el('span', 'cnt rest', '– 쉬는 중 ' + p.counts.resting));
    sum.append(counts);
    det.append(sum);

    const hasSide = p.messages.length || p.board;
    const body = el('div', 'pbody' + (hasSide ? '' : ' solo'));
    const org = el('div', 'org');
    const leader = p.sessions.find((s) => s.isLeader);
    const others = p.sessions.filter((s) => !s.isLeader);
    if (leader) { const lw = el('div', 'lead-wrap'); lw.append(botCard(leader, p.key)); org.append(lw); }
    if (others.length) {
      const tree = el('div', 'tree' + (leader ? '' : ' flat'));
      for (const s of others) tree.append(botCard(s, p.key));
      org.append(tree);
    }
    body.append(org);
    if (hasSide) {
      const side = el('div', 'side');
      if (p.board) side.append(boardPanel(p));
      side.append(feedPanel(p));
      body.append(side);
    }
    det.append(body);
    return det;
  }

  function render(data) {
    const all = data.projects.flatMap((p) => p.sessions);
    const n = (st) => all.filter((s) => s.state === st).length;
    const totals = $('totals');
    totals.replaceChildren();
    const pill = (cls, g, label, v) => { const x = el('span', 'pill ' + cls); x.append(el('span', 'g', g), document.createTextNode(label + ' '), el('b', null, String(v))); return x; };
    totals.append(pill('', '◆', '프로젝트', data.projects.length), pill('', '●', '세션', all.length), pill('run', '▶', '작업 중', n('working')), pill('wait', '○', '대기', n('waiting')), pill('rest', '–', '쉬는 중', n('resting')));
    last = data;
    if (!data.projects.some((p) => p.key === selected)) selected = data.projects[0]?.key || '';
    const tabs = $('tabs');
    tabs.replaceChildren();
    for (const p of data.projects) {
      const t = el('button', 'tab');
      t.type = 'button';
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', String(p.key === selected));
      const lead = p.sessions.find((s) => s.isLeader) || p.sessions[0];
      const face = p.counts.working ? 'working' : p.counts.waiting ? 'waiting' : 'resting';
      t.append(robotNode(lead ? str(lead.name) : p.key, face, !!(lead && lead.isLeader), true), el('span', 'tname', p.key));
      const tc = el('span', 'tc');
      if (p.counts.working) tc.append(el('span', 'r', '▶ ' + p.counts.working));
      if (p.counts.waiting) tc.append(el('span', 'w', '○ ' + p.counts.waiting));
      if (!p.counts.working && !p.counts.waiting) tc.append(el('span', 'z', '– ' + p.counts.resting));
      t.append(tc);
      t.addEventListener('click', () => select(p.key));
      tabs.append(t);
    }
    const feedTop = box0Key === selected ? (document.querySelector('.feed')?.scrollTop || 0) : 0;
    box0Key = selected;
    const box = $('projects');
    const cur = data.projects.find((p) => p.key === selected);
    box.replaceChildren(...(cur ? [projectNode(cur)] : []));
    if (!data.projects.length) box.append(el('div', 'notice', '실행 중인 Claude Code 세션이 없습니다.'));
    const feed = document.querySelector('.feed'); if (feed) feed.scrollTop = feedTop;
    const d = new Date(data.now), p2 = (x) => String(x).padStart(2, '0');
    $('asof').textContent = '갱신 ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }

  function setLive(on, text) { $('live').classList.toggle('on', on); $('live-text').textContent = text; }
  function notice(msg) { const n = $('notice'); n.textContent = msg; n.hidden = !msg; }

  $('logo').append(robotNode('leader', 'working', true, false));

  let timer = null;
  async function tick() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      render(await r.json());
      setLive(true, '실시간'); notice('');
    } catch (e) {
      setLive(false, '끊김'); notice('모니터 서버에 연결할 수 없습니다 — npm start 로 다시 띄우세요.');
    }
    timer = setTimeout(tick, document.hidden ? POLL_MS * 5 : POLL_MS);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); tick(); } });
  tick();
})();
</script>
</body>
</html>
