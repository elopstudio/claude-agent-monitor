<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f7; --bg-grad:#e7ebf5; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e0e3ea; --line-strong:#c8cdd8;
  --text:#171a21; --muted:#5b6372; --faint:#8d95a3;
  --accent:#3a63d8; --accent-soft:#e9eefc;
  --run:#3a63d8; --run-soft:#e9eefc;
  --wait:#8c6a10; --wait-soft:#f7f0dc;
  --block:#b0341f; --block-soft:#fae8e3;
  --done:#4a5260; --done-soft:#eceef2;
  --bubble:#ffffff; --floor:#eef0f6; --shadow:rgba(20,28,48,.08); --bot-shadow:rgba(20,28,48,.16);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
    --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
    --accent:#86a6f5; --accent-soft:#1d2741;
    --run:#86a6f5; --run-soft:#1d2741;
    --wait:#e0bc5e; --wait-soft:#2f2816;
    --block:#f0907d; --block-soft:#3b201b;
    --done:#a3abb8; --done-soft:#232830;
    --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
  --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
  --accent:#86a6f5; --accent-soft:#1d2741;
  --run:#86a6f5; --run-soft:#1d2741;
  --wait:#e0bc5e; --wait-soft:#2f2816;
  --block:#f0907d; --block-soft:#3b201b;
  --done:#a3abb8; --done-soft:#232830;
  --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1400px 520px at 50% -140px,var(--bg-grad),transparent 70%),var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{margin:0 auto;padding:22px 24px 60px}
@media (max-width:640px){ .wrap{padding:18px 16px 48px} }
.mono{font-family:var(--mono)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint);position:relative}
.live.on i{background:var(--run)}
.live.on i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.totals{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 1px 2px var(--shadow)}
.pill b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.pill .g{font-size:10px}
.pill.run b,.pill.run .g{color:var(--run)}
.pill.wait b,.pill.wait .g{color:var(--wait)}
.pill.rest b,.pill.rest .g{color:var(--faint)}

/* Project tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin:0 0 -1px;padding:0 4px;position:relative;z-index:1}
.tab{appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:9px 14px 10px 8px;border-radius:12px 12px 0 0;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:700}
.tab svg{width:26px;height:26px;flex:none}
.tab .tname{font-family:var(--mono)}
.tab .tc{display:inline-flex;gap:4px}
.tab .tc span{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.tab .tc .r{color:var(--run);background:var(--run-soft)}
.tab .tc .w{color:var(--wait);background:var(--wait-soft)}
.tab .tc .z{color:var(--faint);border:1px dashed var(--line-strong);line-height:15px}

/* Project */
.project{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.project>.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.project .folder{font-family:var(--mono);font-weight:700;font-size:16px}
.project .label{color:var(--muted);font-size:12px}
.project .counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-flex;gap:4px;align-items:center}
.cnt.run{color:var(--run);background:var(--run-soft)}
.cnt.wait{color:var(--wait);background:var(--wait-soft)}
.cnt.rest{color:var(--faint);border:1px dashed var(--line-strong)}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}

/* Org chart */
.org{min-width:0}
.tree{position:relative;margin:10px 0 0 42px;padding-left:22px;border-left:2px dashed var(--line-strong);display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tree.flat{margin-left:0;padding-left:0;border-left:0}
.tree:not(.flat)>.bot-card::before{content:"";position:absolute;left:-24px;top:50px;width:22px;border-top:2px dashed var(--line-strong)}
.lead-wrap{max-width:640px}
.role-tag{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--wait);background:var(--wait-soft);border-radius:4px;padding:1px 6px}

.bot-card{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 10px;box-shadow:0 1px 2px var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.bot-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--shadow)}
.bot-card.leader{grid-template-columns:100px minmax(0,1fr);border-color:var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.stage{position:relative;height:96px;border-radius:9px;background:var(--floor);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.leader .stage{height:112px}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,rgba(127,137,160,.10))}
.stage .robot{width:72px;height:72px;position:relative;z-index:1;margin-bottom:8px}
.leader .stage .robot{width:88px;height:88px}
.stage .shadow{position:absolute;bottom:7px;left:50%;width:40px;height:6px;margin-left:-20px;border-radius:50%;background:var(--bot-shadow);filter:blur(1px)}
.st-working .stage .shadow{animation:shadow 1.8s ease-in-out infinite}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.7}}
.info{min-width:0;display:flex;flex-direction:column;gap:5px}
.info .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .nm{display:flex;align-items:baseline;gap:6px;min-width:0}
.info .short{font-family:var(--mono);font-weight:700;font-size:15px}
.info .nick{font-weight:900;font-size:15px;white-space:nowrap}
.info .full{font-family:var(--mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .title{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;margin-left:4px;display:flex;gap:7px;align-items:flex-start}
.bubble::before{content:"";position:absolute;left:-6px;top:11px;width:9px;height:9px;background:var(--bubble);border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
.bubble .k{flex:none;font-size:12px;line-height:1.55}
.st-resting .bubble{color:var(--faint);border-style:dashed}
.st-resting .bubble::before{border-left-style:dashed;border-bottom-style:dashed}
.info .when{color:var(--faint);font-size:11px;margin-left:4px;display:flex;gap:8px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge .g{font-size:9px;line-height:1}
.b-run{color:var(--run);background:var(--run-soft)}
.b-wait{color:var(--wait);background:var(--wait-soft)}
.b-block{color:var(--block);background:var(--block-soft);border-color:var(--block)}
.b-done{color:var(--done);background:var(--done-soft)}
.b-rest{color:var(--faint);border-color:var(--line-strong);border-style:dashed}

/* Robots — state is shown by face and motion, not colour */
.robot *{transform-box:view-box}
.robot .rb{transform-origin:32px 60px}
.st-working .robot .rb{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.st-working .robot .eyes{transform-origin:32px 28px;animation:blink 4.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.st-working .robot .arm-l{transform-origin:16.5px 47px;animation:type .45s ease-in-out infinite alternate}
.st-working .robot .arm-r{transform-origin:47.5px 47px;animation:type .45s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.st-working .robot .bulb,.st-working .robot .core{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{opacity:.3}}
.st-waiting .robot .rb{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.robot .zz{font:900 9px var(--sans);fill:var(--muted);opacity:0;animation:float 3s ease-in infinite}
.robot .zz.b{animation-delay:1.5s;font-size:7px}
@keyframes float{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.st-resting .robot .rb{filter:grayscale(1);opacity:.5}
@media (prefers-reduced-motion:reduce){.robot *,.live i::after,.stage .shadow{animation:none!important}}

/* Side column — team chat and board */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--surface)}
.panel>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint)}
.feed{list-style:none;margin:0;padding:6px 0;max-height:360px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:6px 12px}
.feed .who{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
.feed .who svg{width:18px;height:18px}
.feed .arrow{color:var(--faint);font-weight:500}
.feed .s{font-size:12.5px;overflow-wrap:anywhere}
.feed .t{color:var(--faint);font-size:11px}
.empty{color:var(--faint);font-size:12px;padding:12px;text-align:center}

/* Board — a kanban under the org chart */
.kanban{border-top:1px solid var(--line);padding:12px 16px 16px}
.kanban>h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kanban>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint);font-size:11.5px}
.kanban>.empty{border:1px dashed var(--line-strong);border-radius:10px}
.kcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 4px;min-width:0}
.kcol>h4{margin:0 2px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.kcol>h4 .n{margin-left:auto;font-family:var(--mono);color:var(--faint);font-weight:500}
.kcol.k-run{border-top:3px solid var(--run)}
.kcol.k-queue{border-top:3px solid var(--wait)}
.kcol.k-dec{border-top:3px dashed var(--block)}
.kcol.k-done{border-top:3px solid var(--line-strong)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 5px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;position:relative}
.task.blocked{border-color:var(--block);padding-left:13px}
.task.blocked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:8px 0 0 8px;background:repeating-linear-gradient(45deg,var(--block) 0 3px,transparent 3px 6px)}
.task .pos{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .ss{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.task.done{background:transparent;color:var(--muted)}
.more{font-size:11px;color:var(--faint);padding:0 4px 4px}

.notice{margin:0 0 16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px}

@media (max-width:1100px){ .pbody{grid-template-columns:1fr} .kcols{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .tree{margin-left:14px;padding-left:14px;grid-template-columns:1fr}
  .tree:not(.flat)>.bot-card::before{left:-16px;width:14px}
  .bot-card,.bot-card.leader{grid-template-columns:76px minmax(0,1fr)}
  .leader .stage .robot{width:72px;height:72px}
  .project .counts{margin-left:0}
  .kcols{grid-template-columns:minmax(0,1fr)}
}

/* Approvals — requests waiting for a click, above everything else */
.approvals{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.approvals:empty{display:none}
.approval{background:var(--surface);border:2px solid var(--wait);border-radius:12px;padding:12px 14px;box-shadow:0 4px 14px var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.approval .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.approval .who svg{width:24px;height:24px}
.approval .who b{font-weight:900}
.approval .who .agent{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:999px;padding:2px 10px 2px 4px;display:inline-flex;align-items:center;gap:6px;font:inherit;cursor:pointer}
.approval .who .agent:hover{border-color:var(--wait)}
.approval .who .agent svg{width:28px;height:28px}
.approval .who .agent .sh{font-family:var(--mono);font-size:11px;color:var(--faint)}
.approval .about{margin:4px 0 0;font-size:12px;color:var(--muted)}
.bot-card.asking{border:2px solid var(--wait);box-shadow:0 0 0 4px var(--wait-soft)}
.bot-card.asking .bubble{border-color:var(--wait);border-width:2px}
.bot-card .ask-tag{font-size:10.5px;font-weight:900;letter-spacing:.04em;color:var(--surface);background:var(--wait);border-radius:4px;padding:1px 6px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .bot-card.asking{animation:asking 1.6s ease-in-out infinite} }
@keyframes asking{50%{box-shadow:0 0 0 7px var(--wait-soft)}}
.approval .who .proj{font-family:var(--mono);color:var(--muted);font-size:12px}
.approval .ask{font-size:11px;font-weight:900;letter-spacing:.04em;color:var(--wait);background:var(--wait-soft);border-radius:4px;padding:1px 7px}
.approval .left{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.approval .what{margin:6px 0 0;font-size:13px}
.approval pre{margin:6px 0 0;font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto}
.approval .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.approval button{appearance:none;font:700 13px var(--sans);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
.approval button.allow{background:var(--run);border-color:var(--run);color:var(--surface)}
.approval button.deny{color:var(--block);border-color:var(--block)}
.approval button.always{color:var(--run);border-color:var(--run);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.approval .acts{max-width:560px}
.approval button:disabled{opacity:.5;cursor:default}
.approval .done{font-weight:900;font-size:13px;padding:8px 4px}
.approval .qs{display:flex;flex-direction:column;gap:12px;margin:10px 0 0}
.approval .q .qh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:0 0 6px}
.approval .q .chip{font-size:10.5px;font-weight:900;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.approval .q .qt{font-weight:700;font-size:13.5px}
.approval .q .multi{font-size:11px;color:var(--faint)}
.approval .opts{display:flex;flex-wrap:wrap;gap:6px}
.approval .opt{appearance:none;text-align:left;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;font:500 13px var(--sans);max-width:360px}
.approval .opt small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
.approval .opt[aria-pressed="true"]{border:2px solid var(--run);background:var(--run-soft);padding:6px 9px}
.approval .opt[aria-pressed="true"]::before{content:"✓ ";font-weight:900;color:var(--run)}
.approval .other{margin:6px 0 0;width:100%;max-width:520px;font:13px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px}
.approval pre.plan{max-height:420px;font-size:12.5px}
.approval .warn{color:var(--block);font-size:12px;font-weight:700}
.approval .done.ok{color:var(--run)}
.approval .done.bad{color:var(--block)}
@media (max-width:640px){ .approval{grid-template-columns:1fr} .approval .acts{justify-content:stretch} .approval button{flex:1} }
.tab .tc .a{color:var(--surface);background:var(--wait)}
.info .marks{display:flex;align-items:center;gap:5px;flex:none}
.mode{font-size:10px;font-weight:900;letter-spacing:.05em;border-radius:4px;padding:1px 6px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.mode.m-auto,.mode.m-bypassPermissions,.mode.m-dontAsk{color:var(--block);border-color:var(--block)}

/* Language switch */
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 11.5px var(--sans);padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo st-working" id="logo"></span>
      <div>
        <h1 data-i18n="title"></h1>
        <div class="sub"><span class="live" id="live"><i></i><span id="live-text"></span></span><span id="asof"></span></div>
      </div>
    </div>
    <div class="right">
      <div class="totals" id="totals"></div>
      <div class="lang" id="lang" role="group" aria-label="Language">

  function accessory(acc, dark) {

  function face(st) {

    if (st === 'resting') return `<path d="M22 28 L28 28" stroke="#7b8594" stroke-width="2.2" stroke-linecap="round"/><path d="M36 28 L42 28" stroke="#7b8594" stroke-width="2.2" stroke-linecap="round"/><path d="M30 34 L34 34" stroke="#7b8594" stroke-width="1.6" stroke-linecap="round"/>`;

  function feedPanel(p) {

    };

    const byOrder = (a, c) => (Number(a.order) || 999) - (Number(c.order) || 999);
    const dec = (Array.isArray(b.decisions) ? b.decisions : []).filter((d) => d.status !== 'closed')
      .map((d) => ({ title: d.title, status: 'queued', order: d.order })).sort(byOrder);

    cols.append(
      column('k-dec', '? ' + t('decisions'), dec, true, 12),
      column('k-run', '▶ ' + t('inProgress'), tasks.filter((x) => x.status === 'running'), false, 12),
      column('k-queue', '○ ' + t('queued'), tasks.filter((x) => x.status === 'queued' || x.status === 'blocked')
        .sort((a, c) => (a.status === 'blocked') - (c.status === 'blocked') || byOrder(a, c)), true, 12),
      column('k-done', '✓ ' + t('done'), tasks.filter((x) => x.status === 'done').sort((a, c) => time(c.doneAt) - time(a.doneAt)), false, 8),
    );
    panel.append(cols);
    return panel;
  }

  function projectNode(p) {
    const sec = el('section', 'project');
    sec.setAttribute('role', 'tabpanel');
    const head = el('div', 'phead');
    head.append(el('span', 'folder', p.key));
    if (p.label) head.append(el('span', 'label', p.label));
    const counts = el('span', 'counts');
    if (p.counts.working) counts.append(el('span', 'cnt run', '▶ ' + t('working') + ' ' + p.counts.working));
    if (p.counts.waiting) counts.append(el('span', 'cnt wait', '○ ' + t('waiting') + ' ' + p.counts.waiting));
    if (p.counts.resting) counts.append(el('span', 'cnt rest', '– ' + t('resting') + ' ' + p.counts.resting));
    head.append(counts);
    sec.append(head);

    const body = el('div', 'pbody');
    const org = el('div', 'org');
    const leader = p.sessions.find((s) => s.isLeader);
    const others = p.sessions.filter((s) => !s.isLeader);
    if (leader) { const lw = el('div', 'lead-wrap'); lw.append(botCard(leader)); org.append(lw); }
    if (others.length) {
      const tree = el('div', 'tree' + (leader ? '' : ' flat'));
      for (const s of others) tree.append(botCard(s));
      org.append(tree);
    }
    const side = el('div', 'side');
    side.append(feedPanel(p));
    body.append(org, side);
    sec.append(body, boardPanel(p));
    return sec;
  }

  const secsLeft = (a) => Math.max(0, Math.round((a.expiresAt - Date.now()) / 1000));
  function approvalsNode(data) {
    const box = $('approvals');
    const list = data.approvals || [];
    // rebuild only when the set of requests changes, so a click in progress is not thrown away
    const ids = list.map((a) => a.id).join(',');
    if (box.dataset.ids === ids) {
      for (const a of list) { const n = box.querySelector('[data-id="' + a.id + '"] .left'); if (n) n.textContent = t('left', { n: secsLeft(a) }); }
      return;
    }
    box.dataset.ids = ids;
    box.replaceChildren();
    for (const a of list) {
      const card = el('div', 'approval');
      card.dataset.id = a.id;
      const main = el('div');
      const who = el('div', 'who');
      const name = str(lang === 'ko' && a.nickKo || a.nick) || str(a.session) || '?';
      const kind = a.questions ? 'question' : a.plan ? 'plan' : 'tool';
      who.append(el('span', 'ask', kind === 'question' ? t('questionKind') : kind === 'plan' ? t('planKind') : t('askTitle')));
      if (a.session) {
        // the same robot as on the agent's card, so it can be matched at a glance
        const agent = el('button', 'agent');
        agent.type = 'button';
        agent.append(robotNode(str(a.session), 'working', !!a.isLeader, true), el('b', null, name));
        if (a.short) agent.append(el('span', 'sh', str(a.short)));
        if (a.project) agent.addEventListener('click', () => select(str(a.project)));
        who.append(agent);
        if (a.project) who.append(el('span', 'proj', str(a.project)));
      } else {
        who.append(el('b', null, t('unknownAgent')));
      }
      who.append(el('span', 'proj', str(a.tool)), el('span', 'left', t('left', { n: secsLeft(a) })));
      main.append(who);
      if (a.about) main.append(el('div', 'about', str(a.about)));
      if (a.what) main.append(el('div', 'what', str(a.what)));
      if (a.code) main.append(el('pre', null, str(a.code)));
      if (a.plan) main.append(el('pre', 'plan', str(a.plan)));
      // one entry per question: the picked labels plus any typed answer
      const picks = [];
      if (a.questions) {
        const qs = el('div', 'qs');
        a.questions.forEach((q, qi) => {
          const pick = { labels: new Set(), other: null };
          picks.push(pick);
          const box = el('div', 'q');
          const qh = el('div', 'qh');
          if (q.header) qh.append(el('span', 'chip', str(q.header)));
          qh.append(el('span', 'qt', str(q.question)));
          if (q.multiSelect) qh.append(el('span', 'multi', t('pickMany')));
          const opts = el('div', 'opts');
          for (const o of q.options || []) {
            const b = el('button', 'opt');
            b.type = 'button';
            b.setAttribute('aria-pressed', 'false');
            b.append(document.createTextNode(str(o.label)));
            if (o.description) b.append(el('small', null, str(o.description)));
            b.addEventListener('click', () => {
              const on = !pick.labels.has(o.label);
              if (!q.multiSelect) { pick.labels.clear(); for (const x of opts.children) x.setAttribute('aria-pressed', 'false'); }
              if (on) pick.labels.add(o.label); else pick.labels.delete(o.label);
              b.setAttribute('aria-pressed', String(on));
            });
            opts.append(b);
          }
          const other = document.createElement('input');
          other.className = 'other';
          other.placeholder = t('otherPh');
          other.setAttribute('aria-label', t('otherPh'));
          pick.other = other;
          box.append(qh, opts, other);
          qs.append(box);
        });
        main.append(qs);
      }
      const collect = () => picks.map((p, i) => {
        const parts = [...p.labels];
        if (p.other && p.other.value.trim()) parts.push(p.other.value.trim());
        return { i, value: parts.join(', ') };
      });
      const acts = el('div', 'acts');
      const btn = (cls, label, answer, pick, getAnswers) => {
        const b = el('button', cls, label);
        b.type = 'button';
        b.addEventListener('click', async () => {
          const answers = getAnswers ? getAnswers() : undefined;
          if (answers && answers.some((x) => !x.value)) {
            let w = acts.querySelector('.warn');
            if (!w) { w = el('div', 'warn'); acts.prepend(w); }
            w.textContent = t('needAnswers');
            return;
          }
          for (const x of acts.querySelectorAll('button')) x.disabled = true;
          const send = () => fetch('/api/decide', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ id: a.id, answer, pick, answers }) });
          let status = 0;
          try {
            let r = await send();
            if (r.status === 403) { await refreshToken(); r = await send(); }   // the server restarted since this page loaded
            status = r.status;
          } catch (e) { status = 0; }
          // say what happened right on the card, then let the next poll clear it
          const done = el('div', 'done ' + (status === 200 ? 'ok' : 'bad'),
            status === 200 ? t(kind === 'plan' && answer === 'allow' ? 'didPlan' : kind === 'plan' && answer === 'deny' ? 'didKeep' : { allow: 'didAllow', always: 'didAlways', deny: 'didDeny', stop: 'didStop', answers: 'didAnswer' }[answer] || 'didEditor') : status === 404 ? t('gone') : t('failed'));
          acts.replaceChildren(done);
          clearTimeout(timer); timer = setTimeout(tick, 1200);
        });
        return b;
      };
      if (kind === 'question') {
        acts.append(btn('allow', t('sendAnswers'), 'answers', undefined, collect), btn('', t('inEditor'), 'editor'));
      } else if (kind === 'plan') {
        acts.append(btn('allow', t('approvePlan'), 'allow'), btn('deny', t('keepPlanning'), 'deny'), btn('', t('inEditor'), 'editor'));
      } else acts.append(btn('allow', t('allow'), 'allow'));
      // the same "yes, and don't ask again for …" choices VS Code would offer
      (kind === 'tool' && Array.isArray(a.options) ? a.options : []).forEach((label, i) => {
        const b = btn('always', t('always', { x: str(label) }), 'always', i);
        b.title = str(label);
        acts.append(b);
      });
      if (kind === 'tool') acts.append(btn('deny', t('deny'), 'deny'), btn('deny', t('stop'), 'stop'), btn('', t('inEditor'), 'editor'));
      card.append(main, acts);
      box.append(card);
    }
  }

  function render(data) {
    approvalsNode(data);
    last = data;
    const all = data.projects.flatMap((p) => p.sessions);
    const n = (st) => all.filter((s) => s.state === st).length;
    const totals = $('totals');
    totals.replaceChildren();
    const pill = (cls, g, label, v) => { const x = el('span', 'pill ' + cls); x.append(el('span', 'g', g), document.createTextNode(label + ' '), el('b', null, String(v))); return x; };
    totals.append(pill('', '◆', t('projects'), data.projects.length), pill('', '●', t('sessions'), all.length), pill('run', '▶', t('working'), n('working')), pill('wait', '○', t('waiting'), n('waiting')), pill('rest', '–', t('resting'), n('resting')));

    if (!data.projects.some((p) => p.key === selected)) selected = data.projects[0]?.key || '';
    const tabs = $('tabs');
    // the tabs are rebuilt on every poll — keep keyboard focus on the same tab
    const focusedTab = tabs.contains(document.activeElement) ? document.activeElement.dataset.key : null;
    tabs.replaceChildren();
    for (const p of data.projects) {
      const tab = el('button', 'tab');
      tab.type = 'button';
      tab.dataset.key = p.key;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(p.key === selected));
      tab.tabIndex = p.key === selected ? 0 : -1;
      const lead = p.sessions.find((s) => s.isLeader) || p.sessions[0];
      const mood = p.counts.working ? 'working' : p.counts.waiting ? 'waiting' : 'resting';
      tab.append(robotNode(lead ? str(lead.name) : p.key, mood, !!(lead && lead.isLeader), true), el('span', 'tname', p.key));
      const tc = el('span', 'tc');
      if (p.counts.working) tc.append(el('span', 'r', '▶ ' + p.counts.working));
      if (p.counts.waiting) tc.append(el('span', 'w', '○ ' + p.counts.waiting));
      if (!p.counts.working && !p.counts.waiting) tc.append(el('span', 'z', '– ' + p.counts.resting));
      const asks = (data.approvals || []).filter((a) => a.project === p.key).length;
      if (asks) tc.prepend(el('span', 'a', '! ' + asks));
      tab.append(tc);
      tab.addEventListener('click', () => select(p.key));
      tabs.append(tab);
    }
    if (focusedTab != null) [...tabs.children].find((b) => b.dataset.key === focusedTab)?.focus();

    // re-rendering every few seconds must not throw away the chat scroll position
    const feedTop = box0Key === selected ? (document.querySelector('.feed')?.scrollTop || 0) : 0;
    box0Key = selected;
    const box = $('projects');
    const cur = data.projects.find((p) => p.key === selected);
    box.replaceChildren(...(cur ? [projectNode(cur)] : []));
    if (!data.projects.length) box.append(el('div', 'notice', t('noSessions')));
    const feed = document.querySelector('.feed'); if (feed) feed.scrollTop = feedTop;

    const d = new Date(data.now), p2 = (x) => String(x).padStart(2, '0');
    $('asof').textContent = t('updated', { t: p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) });
  }

  function setLive(on) { $('live').classList.toggle('on', on); $('live-text').textContent = on ? t('live') : t('offline'); }
  function notice(msg) { const n = $('notice'); n.textContent = msg; n.hidden = !msg; }

  for (const b of document.querySelectorAll('#lang button')) b.addEventListener('click', () => setLang(b.dataset.lang));
  // ← → Home End move between project tabs
  $('tabs').addEventListener('keydown', (e) => {
    const list = [...$('tabs').children], i = list.indexOf(document.activeElement);
    if (i < 0) return;
    const j = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: list.length - 1 }[e.key];
    if (j == null) return;
    e.preventDefault();
    const next = list[(j + list.length) % list.length];
    select(next.dataset.key);
    [...$('tabs').children].find((b) => b.dataset.key === next.dataset.key)?.focus();
  });
  $('logo').append(robotNode('leader', 'working', true, false));
  applyStatic();

  let timer = null;
  async function refreshToken() {
    try { const d = await (await fetch('/api/state?visible=1', { cache: 'no-store' })).json(); if (d.token) token = d.token; } catch (e) {}
  }
  async function tick() {
    try {
      const r = await fetch('/api/state?visible=' + (document.hidden ? 0 : 1), { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      const data = await r.json();
      if (data.token) token = data.token;
      render(data);
      setLive(true); notice('');
    } catch (e) {
      setLive(false); notice(t('noServer'));
    }
    timer = setTimeout(tick, document.hidden ? POLL_MS * 5 : (last?.approvals?.length ? FAST_MS : POLL_MS));
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); tick(); } });
  tick();
})();
</script>
</body>
</html>
