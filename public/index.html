<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELOP Crew</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f7; --bg-grad:#e7ebf5; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e0e3ea; --line-strong:#c8cdd8;
  --text:#171a21; --muted:#5b6372; --faint:#8d95a3;
  --accent:#3a63d8; --accent-soft:#e9eefc;
  --run:#3a63d8; --run-soft:#e9eefc;
  --wait:#8c6a10; --wait-soft:#f7f0dc;
  --block:#b0341f; --block-soft:#fae8e3;
  --done:#4a5260; --done-soft:#eceef2;
  --claude:#a8502f; --claude-soft:#f8e9e2;
  --bubble:#ffffff; --floor:#eef0f6; --shadow:rgba(20,28,48,.08); --bot-shadow:rgba(20,28,48,.16);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
    --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
    --accent:#86a6f5; --accent-soft:#1d2741;
    --run:#86a6f5; --run-soft:#1d2741;
    --wait:#e0bc5e; --wait-soft:#2f2816;
    --block:#f0907d; --block-soft:#3b201b;
    --done:#a3abb8; --done-soft:#232830;
    --claude:#e8977a; --claude-soft:#35221b;
    --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
  --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
  --accent:#86a6f5; --accent-soft:#1d2741;
  --run:#86a6f5; --run-soft:#1d2741;
  --wait:#e0bc5e; --wait-soft:#2f2816;
  --block:#f0907d; --block-soft:#3b201b;
  --done:#a3abb8; --done-soft:#232830;
  --claude:#e8977a; --claude-soft:#35221b;
  --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
/* thin scrollbars in the page's own colours (Firefox, and Chromium 121+) */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
/* older Chromium / Safari */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:var(--line-strong);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0}
body{background:radial-gradient(1400px 520px at 50% -140px,var(--bg-grad),transparent 70%),var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{--gut:24px;margin:0 auto;padding:0 var(--gut) 60px}
@media (max-width:640px){ .wrap{--gut:16px;padding-bottom:48px} }
/* header, approvals and tabs stay on screen; approvals scroll inside when there are many */
.top .brand-wrap{display:flex;align-items:center;gap:8px}
.sticky{position:sticky;top:0;z-index:20;margin:0 calc(-1 * var(--gut));padding:16px var(--gut) 0;background:var(--bg)}

.mono{font-family:var(--mono)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none}
/* the wordmark: Crew, heavy, in a violet gradient */
.top h1.wordmark{display:flex;align-items:baseline;gap:7px;line-height:1}
.wordmark .w-crew{font-size:27px;font-weight:900;letter-spacing:-.035em;background:linear-gradient(100deg,#6d7cff 10%,#a46bff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.brand .name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagline{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.for-claude{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--claude);background:var(--claude-soft);border:1px solid color-mix(in srgb,var(--claude) 35%,transparent);white-space:nowrap}
.sub{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint);position:relative}
.live.on i{background:var(--run)}
.live.on i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.totals{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 1px 2px var(--shadow)}
.pill b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.pill .g{font-size:10px}
.pill{position:relative}
.pill[tabindex]{cursor:default}
/* a pill's list: it stays a moment after the pointer leaves (visibility waits, a list does not vanish on the way to it
   or on a slip off its edge), and the gap down to it counts as on the pill — a bridge on the pill itself, since the
   list scrolls and would cut off one of its own */
.pill .pillpop{display:block;visibility:hidden;opacity:0;transition:opacity .12s,visibility 0s linear .25s;position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:220px;max-width:320px;max-height:min(420px,70vh);overflow-y:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px}
.pill[tabindex]::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px}
.pill:hover .pillpop,.pill:focus-within .pillpop{visibility:visible;opacity:1;transition-delay:0s}
.totals .pill:nth-last-child(-n+2) .pillpop{left:auto;right:0}   /* the last ones open leftwards, so they stay on a narrow window */
.pill .pi{appearance:none;display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:12.5px var(--sans)}
.pill .pi:hover,.pill .pi:focus-visible{background:var(--accent-soft)}
.pill .pi svg{width:28px;height:21px;flex:none}
.pill .pnobot{width:28px;flex:none}
.pill .ptx{min-width:0;flex:1}
.pill .pn{font-weight:800}
.pill .ps{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pmore{padding:4px 10px;color:var(--faint);font-size:11.5px}
.pill.run b,.pill.run .g{color:var(--run)}
.pill.wait b,.pill.wait .g{color:var(--wait)}
.pill.rest b,.pill.rest .g{color:var(--faint)}

/* Project tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin:0 0 -1px;padding:0 4px;position:relative;z-index:1}
.tab{appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:9px 14px 10px 8px;border-radius:12px 12px 0 0;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:700}
.tab.dragging{opacity:.45}
.tab.drop-before{box-shadow:inset 3px 0 0 var(--accent)}
.tab.drop-after{box-shadow:inset -3px 0 0 var(--accent)}
.tab svg{width:26px;height:26px;flex:none}
.tab .tname{font-family:var(--mono)}
/* the "all agents" label is words, not a folder name */
.tab .tname.all,.project .folder.all{font-family:var(--sans)}
.role-tag,.info .short{white-space:nowrap}
.all-group .bot-card.leader{grid-template-columns:84px minmax(0,1fr)}
.all-group .leader .stage{height:96px}
.all-group .leader .stage .robot{width:72px;height:72px}
.tab .tc{display:inline-flex;gap:4px}
.tab .tc span{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.tab .tc .r{color:var(--run);background:var(--run-soft)}
.tab .tc .w{color:var(--wait);background:var(--wait-soft)}
.tab .all-ico{width:26px;height:26px;display:grid;place-items:center;font-size:15px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.tab .tc .z{color:var(--faint);border:1px dashed var(--line-strong);line-height:15px}

/* Project */
.project{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.project>.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.project .folder{font-family:var(--mono);font-weight:700;font-size:16px}
.project .prename{appearance:none;border:0;background:none;color:var(--faint);cursor:pointer;font-size:13px;padding:2px 4px;margin-left:-4px;opacity:0;transition:opacity .15s}
.project .phead:hover .prename,.project .prename:focus-visible{opacity:1}
.project .prename:hover{color:var(--text)}
.project .label{color:var(--muted);font-size:12px}
.project .counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-flex;gap:4px;align-items:center}
.cnt.run{color:var(--run);background:var(--run-soft)}
.cnt.wait{color:var(--wait);background:var(--wait-soft)}
.cnt.rest{color:var(--faint);border:1px dashed var(--line-strong)}
.all-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.all-group>h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.all-group>h3 .pgo{appearance:none;border:0;background:none;padding:0;color:var(--text);font:700 15px var(--mono);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.all-group>h3 .pgo:hover{text-decoration-color:var(--text)}
.all-group>h3 .label{color:var(--muted);font-size:12px;font-weight:500}
.all-group>h3 .counts{margin-left:0}   /* next to the name; the button takes the right end */
.all-group>h3 .newagent-btn{margin-left:auto}
.all-group .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}

/* Org chart */
.org{min-width:0}
.tree{position:relative;margin:10px 0 0 42px;padding-left:22px;border-left:2px dashed var(--line-strong);display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tree.flat{margin-left:0;padding-left:0;border-left:0}
.tree:not(.flat)>.bot-card::before{content:"";position:absolute;left:-24px;top:50px;width:22px;border-top:2px dashed var(--line-strong)}
.lead-wrap{max-width:640px}
.role-tag{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--wait);background:var(--wait-soft);border-radius:4px;padding:1px 6px}

.bot-card{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 10px;box-shadow:0 1px 2px var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.bot-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--shadow)}
.bot-card.leader{grid-template-columns:100px minmax(0,1fr);border-color:var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.stage{position:relative;height:96px;border-radius:9px;background:var(--floor);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.leader .stage{height:112px}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,rgba(127,137,160,.10))}
.stage .robot{width:72px;height:72px;position:relative;z-index:1;margin-bottom:8px}
.leader .stage .robot{width:88px;height:88px}
.stage .shadow{position:absolute;bottom:7px;left:50%;width:40px;height:6px;margin-left:-20px;border-radius:50%;background:var(--bot-shadow);filter:blur(1px)}
.st-working .stage .shadow{animation:shadow 1.8s ease-in-out infinite}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.7}}
.info{min-width:0;display:flex;flex-direction:column;gap:5px}
.info .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .nm{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.who-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.botname{text-align:center;font-weight:900;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .botname{font-size:15px}
.info .short{font-family:var(--mono);font-weight:700;font-size:15px}
.info .nick{font-weight:900;font-size:15px;white-space:nowrap}
.info .full{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
.info .title{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;margin-left:4px;display:flex;gap:7px;align-items:flex-start;
  height:calc(2 * 1.55em + 16px);width:calc(100% - 4px);appearance:none;text-align:left;font-family:inherit;color:inherit;line-height:1.55;cursor:pointer}
.bubble:hover,.bubble:hover::before{border-color:var(--text)}
.bubble .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.bubble::before{content:"";position:absolute;left:-6px;top:11px;width:9px;height:9px;background:var(--bubble);border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
.bubble .k{flex:none;font-size:12px;line-height:1.55}
.st-resting .bubble{color:var(--faint);border-style:dashed}
.st-resting .bubble::before{border-left-style:dashed;border-bottom-style:dashed}
.info .when{color:var(--faint);font-size:11px;margin-left:4px;display:flex;flex-wrap:wrap;gap:2px 8px;white-space:nowrap;min-width:0}
/* a narrow card wraps to a second line instead of cutting each item short; only an item wider than the card gets an ellipsis */
.info .when>span{overflow:hidden;text-overflow:ellipsis;max-width:100%}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge .g{font-size:9px;line-height:1}
.b-run{color:var(--run);background:var(--run-soft)}
.b-wait{color:var(--wait);background:var(--wait-soft)}
.b-block{color:var(--block);background:var(--block-soft);border-color:var(--block)}
.b-done{color:var(--done);background:var(--done-soft)}
.b-rest{color:var(--faint);border-color:var(--line-strong);border-style:dashed}

/* Robots — state is shown by face and motion, not colour */
.robot *{transform-box:view-box}
.robot .rb{transform-origin:32px 60px}
.st-working .robot .rb{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.st-working .robot .eyes{transform-origin:32px 28px;animation:blink 4.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.st-working .robot .arm-l{transform-origin:16.5px 47px;animation:type .45s ease-in-out infinite alternate}
.st-working .robot .arm-r{transform-origin:47.5px 47px;animation:type .45s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.st-working .robot .bulb,.st-working .robot .core{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{opacity:.3}}
.st-waiting .robot .rb{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.robot .zz{font:900 9px var(--sans);fill:var(--muted);opacity:0;animation:float 3s ease-in infinite}
.robot .zz.b{animation-delay:1.5s;font-size:7px}
@keyframes float{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.st-resting .robot .rb{filter:grayscale(1);opacity:.5}
/* waiting for your answer: not the dozing "z z" of an idle session — eyes wide open, a hop and a "!" */
.robot.asking .rb{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}}
.robot .alert circle{fill:var(--wait)}
.robot .alert text{font:900 10px var(--sans);fill:var(--surface)}
.robot .alert{transform-origin:9px 9px;animation:ping-alert 1.1s ease-in-out infinite}
@keyframes ping-alert{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
/* the page redraws the cards often (every second while a request waits); each new element gets --t, the time since
   the page loaded, as a negative delay — so its animations carry on from where the old element's were */
.robot,.robot *,.bot-card,.stage .shadow{animation-delay:var(--t,0s)!important}
.robot .zz.b{animation-delay:calc(var(--t,0s) + 1.5s)!important}
@media (prefers-reduced-motion:reduce){.robot *,.live i::after,.stage .shadow{animation:none!important}}

/* Side column — team chat and board */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--surface)}
.panel>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint)}
.feed{list-style:none;margin:0;padding:6px 0;max-height:360px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:6px 12px}
.feed .who{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
.feed .who svg{width:18px;height:18px}
.feed .arrow{color:var(--faint);font-weight:500}
.feed .s{font-size:12.5px;overflow-wrap:anywhere}
.feed .t{color:var(--faint);font-size:11px}
.empty{color:var(--faint);font-size:12px;padding:12px;text-align:center}

/* Board — a kanban under the org chart */
.kanban{border-top:1px solid var(--line);padding:12px 16px 16px}
.kanban>h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kanban>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint);font-size:11.5px}
.kanban>.empty{border:1px dashed var(--line-strong);border-radius:10px}
.kcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 4px;min-width:0}
.kcol>h4{margin:0 2px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.kcol>h4 .n{margin-left:auto;font-family:var(--mono);color:var(--faint);font-weight:500}
.kcol.k-run{border-top:3px solid var(--run)}
.kcol.k-queue{border-top:3px solid var(--wait)}
.kcol.k-dec{border-top:3px dashed var(--block)}
.kcol.k-done{border-top:3px solid var(--line-strong)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 5px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;position:relative}
.task.blocked{border-color:var(--block);padding-left:13px}
.task.blocked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:8px 0 0 8px;background:repeating-linear-gradient(45deg,var(--block) 0 3px,transparent 3px 6px)}
.task .pos{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}

.detail .ljump{position:sticky;bottom:12px;display:block;margin:-40px auto 0;z-index:2;appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:999px;padding:5px 14px;font:700 12px var(--sans);cursor:pointer;box-shadow:0 4px 14px var(--shadow)}

.detail .lasks{display:flex;flex-direction:column;gap:8px}

.detail .ltail{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.detail .lbar{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.detail .lbar.busy{color:var(--run);border-color:var(--run);background:var(--run-soft)}
.detail .lbar.ask{color:var(--wait);border-color:var(--wait);background:var(--wait-soft);font-weight:700}
.detail .lbar .dots{display:inline-flex;gap:3px}
.detail .lbar .dots::before,.detail .lbar .dots::after,.detail .lbar .dots{content:""}
.detail .lbar .dots{width:22px;height:6px;background:radial-gradient(circle,currentColor 2.5px,transparent 3px) 0 50%/7.3px 6px repeat-x;animation:dots 1.2s steps(4) infinite;clip-path:inset(0 100% 0 0)}
@keyframes dots{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){ .detail .lbar .dots{animation:none;clip-path:none} }
.detail .lpane{min-height:200px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.detail .m .ts{font-size:10.5px;color:var(--faint);margin-top:3px}
.detail .m.user{align-self:flex-end;max-width:80%;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:8px 11px}
.detail .m.assistant{align-self:flex-start;max-width:92%;padding:2px 4px}
.detail .m .mt.md{white-space:normal}
.detail .md p{margin:0 0 .6em}
.detail .md p:last-child{margin-bottom:0}

.detail .md li{margin:.15em 0}

/* copy buttons: a code block's at its top right, a reply's when it is pointed at */
.codebox{position:relative}
.copy{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:7px;width:28px;height:26px;display:grid;place-items:center;padding:0;cursor:pointer;transition:opacity .15s,color .15s}
.copy svg{width:14px;height:14px}
.copy:hover{color:var(--text);border-color:var(--text)}
.copy.done{color:var(--run);border-color:var(--run)}
.codebox .copy{position:absolute;top:6px;right:6px;opacity:.55}
.codebox:hover .copy,.codebox .copy:focus-visible,.codebox .copy.done{opacity:1}
.m.assistant,.bub.ai{position:relative}
.mcopy{position:absolute;right:6px;bottom:4px;opacity:0}

.detail .md pre.code{font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:auto;white-space:pre;margin:.4em 0 .7em}

.detail .md a{color:var(--accent)}
.detail .md .tablewrap{overflow:auto;margin:.4em 0 .7em}
.detail .md table{border-collapse:collapse;font-size:12.5px}
.detail .md th,.detail .md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}

.detail .m.tool .tbody{border-top:1px solid var(--line)}
.detail .m.tool .tpath{font:11.5px var(--mono);color:var(--muted);padding:6px 10px 0;overflow-wrap:anywhere}
.detail .m.tool pre.term{margin:0;padding:7px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--bg)}
.detail .m.tool pre.diff{margin:6px 10px 8px;padding:6px 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:6px;max-height:320px;overflow:auto}
.detail .m.tool pre.diff span{display:block;padding:0 8px}
.detail .m.tool pre.diff .del{background:var(--block-soft);color:var(--block)}
.detail .m.tool pre.diff .add,.detail .m.tool pre.diff.add-all{background:var(--run-soft);color:var(--run)}
.detail .m.tool pre.diff.add-all{padding:6px 8px}
.detail .m .mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.6}
.detail .m.tool{align-self:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.detail .m.tool.failed{border-color:var(--block)}
.detail .m.tool summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:6px 10px;font-size:12.5px}
.detail .m.tool summary .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.detail .m.tool summary .ts{margin:0}
.detail .m.tool pre,.detail .lpane>pre{margin:0;padding:7px 10px;border-top:1px solid var(--line);font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;color:var(--muted)}
.detail pre.out.err{color:var(--block)}
.detail::backdrop{background:rgba(10,14,24,.45)}
.detail .dh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.detail .dh svg{width:48px;height:48px}
.detail .dh .who{flex:1;min-width:0}
.detail .dh b{font-size:17px;font-weight:900}
.detail .dh .sh{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:6px}
.detail .dh .ddesc{margin-top:2px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail .dh .close{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:6px 12px;font:700 12.5px var(--sans);cursor:pointer}

/* Dock: agent dialogs minimised along the bottom, one click to open or fold again */
.dock{position:fixed;left:20px;bottom:16px;z-index:39;display:flex;flex-wrap:wrap-reverse;gap:6px;max-width:calc(100vw - 40px);margin:0;padding:0}
.dock:empty{display:none}
.dock .dchip{display:inline-flex;align-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;box-shadow:0 4px 14px var(--shadow);max-width:240px}
.dock .dchip.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset,0 4px 14px var(--shadow)}
.dock .dchip.asking{border-color:var(--wait);background:var(--wait-soft)}
.dock .dopen{appearance:none;border:0;background:none;color:var(--text);display:inline-flex;align-items:center;gap:7px;min-width:0;padding:4px 2px 4px 8px;font:700 12.5px var(--sans);cursor:pointer}
.dock .dopen svg{width:24px;height:24px;flex:none}
.dock .dopen .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .dopen .n{font:700 10px var(--mono);color:var(--faint);min-width:.7em}
.dock .dopen .g{font-size:10.5px;color:var(--faint)}
.dock .st-working .g{color:var(--run)}
.dock .st-waiting .g{color:var(--wait)}
.dock .asking .g{color:var(--wait);font-weight:900}
/* how busy it is shows at a glance: one working is full, one waiting a little faded, one resting faded more;
   one asking, the open one and the one under the pointer stay full */
.dock .dchip{transition:opacity .15s}
.dock .dchip.st-waiting:not(.asking):not(.on){opacity:.78}
.dock .dchip.st-resting:not(.asking):not(.on){opacity:.48}
.dock .dchip.st-resting .dopen svg{filter:grayscale(.6)}
.dock .dchip:hover,.dock .dchip:focus-within{opacity:1}
.dock .dx{appearance:none;border:0;background:none;color:var(--faint);font-size:15px;line-height:1;padding:4px 10px 4px 6px;cursor:pointer}
.dock .dx:hover{color:var(--text)}
body.docked main{padding-bottom:56px}
body.docked .detail{bottom:60px;max-height:calc(100vh - 92px)}
.detail dl{margin:0;padding:12px 16px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13px}
.detail dt{color:var(--faint);font-size:12px;white-space:nowrap}
.detail dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.detail form.msg{border-top:1px solid var(--line);padding:12px 16px 16px;display:grid;gap:8px}
.detail form.msg .hint{font-size:12px;color:var(--muted)}
.detail form.msg .status{font-size:12.5px;font-weight:700}
.detail form.msg .status.good{color:var(--run)}
.detail form.msg .status.bad{color:var(--block)}
.detail form.msg .status:empty{display:none}
.detail form.msg.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.detail form.msg .chips{display:flex;flex-wrap:wrap;gap:6px}
.detail form.msg .chips:empty{display:none}
.detail form.msg .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:2px 4px 2px 10px}
.detail form.msg .chip.up{opacity:.6}
.detail form.msg .chip.bad{border-color:var(--block);color:var(--block)}
.detail form.msg .chip .x{appearance:none;border:0;background:none;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;padding:0 4px}
.detail form.msg .runout{margin:0;max-height:260px;overflow:auto;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text)}
.detail form.msg .runout.err{border-color:var(--block)}
.detail form.msg .runout[hidden]{display:none}
/* the composer: a rounded box that grows with the text, its buttons on a row inside */
.composer{border:1px solid var(--line-strong);border-radius:18px;background:var(--surface-2);padding:8px 10px 8px 12px;display:grid;gap:6px;cursor:text;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.detail form.msg.drop .composer{border-style:dashed;border-color:var(--accent)}
.composer textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:4px 2px 2px;margin:0;font:14px/1.55 var(--sans);color:var(--text);max-height:220px;overflow-y:auto;min-height:26px}
.composer textarea::placeholder{color:var(--faint)}
.composer .chips{display:flex;flex-wrap:wrap;gap:6px}
.composer .chip .cname{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.composer .chip .cname:hover{text-decoration:underline}
/* the attachment preview, over the agent's dialog */
.detail.pv:not(.narrow)[open]{height:fit-content;width:min(1000px,calc(100vw - 48px));max-height:calc(100vh - 48px)}
.detail.pv .dh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.detail.pv .pb{flex:1 1 auto;min-height:0;overflow:auto;display:grid;place-items:center;padding:14px;background:var(--bg)}
.detail.pv .pb img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:6px}
.detail.pv .pb pre{align-self:start;justify-self:stretch;margin:0;font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.detail.pv .pb iframe{width:100%;height:calc(100vh - 170px);border:0;background:#fff;border-radius:6px}
.detail.pv .pb .pmsg{color:var(--muted);font-size:13px;display:grid;gap:12px;justify-items:center;padding:30px}
.detail.pv .pb .pdl{color:var(--accent);font-weight:700}
.composer .status{font-size:12px;padding:0 2px}
.composer .chips:empty{display:none}
.composer .ctools{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:default}
.composer .cleft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.composer .cicon{appearance:none;width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.composer .cicon:hover{color:var(--text);border-color:var(--text)}
.composer .cicon svg{width:16px;height:16px}
.composer select{appearance:none;border:1px solid var(--line-strong);background:var(--surface) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 6%27%3E%3Cpath d=%27M1 1l4 4 4-4%27 fill=%27none%27 stroke=%27%238d95a3%27 stroke-width=%271.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E") no-repeat right 10px center/9px 6px;color:var(--text);border-radius:999px;padding:5px 26px 5px 12px;font:700 12px var(--sans);cursor:pointer;max-width:190px}   /* a pill with a small ▾ */
.composer select:hover{border-color:var(--text)}
.composer .modelpick{gap:6px}
.composer .modelpick input{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px;font:12px var(--mono);width:190px}
.composer .csend{appearance:none;width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--text);color:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;transition:opacity .15s}
.composer .csend svg{width:17px;height:17px}
.composer .csend.empty{opacity:.28;cursor:default}
.composer .cright{display:flex;align-items:center;gap:10px;flex:none}
/* how full the conversation is, as a ring by the send button (as in VS Code); amber once long, red near the limit */
.composer .ctxm{appearance:none;border:0;background:none;border-radius:999px;padding:4px 6px;display:flex;align-items:center;gap:5px;color:var(--muted);font:700 11px var(--sans);font-variant-numeric:tabular-nums;cursor:pointer}
.composer .ctxm:hover,.composer .ctxm[aria-expanded="true"]{background:var(--surface)}
.composer .ctxm[hidden]{display:none}
.composer .ctxm svg{width:18px;height:18px;transform:rotate(-90deg);display:block}
.composer .ctxm circle{fill:none;stroke-width:3}
.composer .ctxm .bg{stroke:var(--line-strong)}
.composer .ctxm .fg{stroke:currentColor;transition:stroke-dasharray .4s}
.composer .ctxm.long{color:var(--wait)}
.composer .ctxm.full{color:var(--block)}
.composer .ctxpop{position:absolute;right:8px;bottom:calc(100% + 8px);z-index:30;width:300px;max-width:calc(100% - 16px);background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px;cursor:default;font-size:12.5px;line-height:1.45;color:var(--text)}
.composer .ctxpop[hidden]{display:none}
.composer .ctxpop .ch{font-weight:800;font-size:13px}
.composer .ctxpop .cbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.composer .ctxpop .cbar i{display:block;height:100%;background:var(--muted);border-radius:inherit;transition:width .4s}
.composer .ctxpop.long .cbar i{background:var(--wait)}
.composer .ctxpop.full .cbar i{background:var(--block)}
.composer .ctxpop .cl{font-variant-numeric:tabular-nums;color:var(--muted)}
.composer .ctxpop .ct{color:var(--muted)}
.composer .ctxpop .cgo{appearance:none;justify-self:start;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:5px 12px;font:700 12px var(--sans);cursor:pointer}
.composer .ctxpop .cgo:hover{border-color:var(--text)}
.composer .ctxpop .cgo:disabled{opacity:.6;cursor:default}
.composer .csend.run{background:var(--run)}
.composer .csend:disabled{opacity:.45;cursor:default}
/* the "/" list: Claude Code's slash commands, above the box while the first word is typed */
.composer{position:relative}
/* images a tool returned, under its result */
.rimgs{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 2px}
.rimgs img{max-width:min(100%,360px);max-height:240px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.composer .slash{position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:min(300px,50vh);overflow-y:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;z-index:30;cursor:default}
.composer .slash button{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:6px 10px;border-radius:9px;cursor:pointer;font:13px var(--sans)}
.composer .slash button.on{background:var(--accent-soft)}
.composer .slash .sn{font:700 13px var(--mono)}
.composer .slash .sh{font:12px var(--mono);color:var(--faint);margin-left:8px}
.composer .slash .sd{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.composer .slash .sempty{padding:8px 10px;color:var(--muted);font-size:12px}
.dock .dchip{cursor:grab}
.dock .dchip.dragging{opacity:.45}

.dock .dchip.drop-after{box-shadow:inset -3px 0 0 var(--accent)}
.info .when{align-items:center}
.tab .tc .a{color:var(--surface);background:var(--wait)}

.detail dd .nudge{appearance:none;margin-left:8px;border:1px solid var(--block);background:var(--surface-2);color:var(--block);border-radius:8px;padding:2px 10px;font:700 12px var(--sans);cursor:pointer}

.about dl{margin:0;padding:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.about dt{color:var(--faint);font-size:12px;white-space:nowrap}

:root[data-theme="dark"] .about .elop img.b{display:none}

.about pre{margin:0;max-height:220px;overflow:auto;font:11.5px/1.5 var(--mono);white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
.detail.narrow .dtabs{padding:8px 18px 0}
.about[hidden],.keys[hidden]{display:none}
.keys{padding:14px 18px 18px;display:grid;gap:14px;font-size:13px}
.keys h4{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.keys dl{margin:0;padding:0;display:grid;grid-template-columns:190px minmax(0,1fr);gap:7px 16px;align-items:baseline}
.keys dt{white-space:nowrap;color:var(--faint);font-size:11px}
.keys dd{margin:0;overflow-wrap:anywhere}
.keys kbd{display:inline-block;font:700 11.5px var(--mono);color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;line-height:19px}
/* the processes view */
.bell.hot{color:var(--block);border-color:var(--block)}
.info .when .procs-chip{font-variant-numeric:tabular-nums}
.info .when .procs-chip.hot{color:var(--block);font-weight:700}
.procs{padding:12px 16px 16px;display:grid;gap:10px}
.procs .pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.procs .pbar .psum{flex:1;min-width:0}
.procs .pbar select{font:13px var(--sans);color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px}
.procs .pgroup{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.procs .pgh{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-2);font-size:13px}
.procs .pgh svg{width:22px;height:22px}
.procs .pgh .pproj{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.procs .pgh .ptot{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.procs .prow{display:grid;grid-template-columns:minmax(0,1fr) 56px 70px 70px auto;gap:10px;align-items:center;padding:5px 10px 5px calc(10px + var(--depth,0) * 16px);border-top:1px solid var(--line);font-size:12.5px}
.procs .prow.hot .pcpu{color:var(--block);font-weight:900}
.procs .prow.k-hook{opacity:.55}
.procs .prow.k-agent{background:var(--surface-2)}
.procs .pwhat{display:flex;gap:6px;align-items:baseline;min-width:0}
.procs .pwhat b{flex:none}
.procs .pkind{flex:none;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.procs .pcmd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--faint)}
.procs .pcpu,.procs .pmem,.procs .pup{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.procs .pkill{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--block);border-radius:6px;padding:2px 9px;font:700 11.5px var(--sans);cursor:pointer}
.procs .pkill:hover{border-color:var(--block)}
.procs .pkill:disabled{opacity:.4;cursor:default}
.procs .pnone{color:var(--muted);font-size:13px;padding:20px;text-align:center}
/* the last quarter hour, stacked by agent, with the whole PC as a dashed line over it; colours validated as a set */
.procs .pchart{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--so:#b9bfca;position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 12px 6px;background:var(--surface)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .procs .pchart{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--so:#4a5262} }
:root[data-theme="dark"] .procs .pchart{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--so:#4a5262}
.procs .pclegend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.procs .pclegend .pctitle{color:var(--text);font-size:12.5px;margin-right:auto}
.procs .pli{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.procs .pli b{color:var(--text);font-variant-numeric:tabular-nums}
.procs .pli .sw{width:10px;height:10px;border-radius:3px;flex:none}
.procs .pli .ln{width:14px;border-top:2px dashed var(--muted);flex:none}
.procs button.pli{appearance:none;border:1px solid var(--line);background:none;border-radius:6px;padding:1px 7px;font:12px var(--sans);color:var(--muted);cursor:pointer}
.procs button.pli[aria-pressed="false"] .ln{opacity:.4}
.procs .pchart svg{display:block;width:100%;overflow:visible}
.procs .pchart svg text{font:10.5px var(--sans);fill:var(--faint);font-variant-numeric:tabular-nums}
.procs .pcwait{color:var(--muted);font-size:12.5px;padding:26px 0;text-align:center}
.procs .pctip{position:absolute;z-index:2;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--muted);box-shadow:0 6px 20px rgba(0,0,0,.14);white-space:nowrap;display:grid;gap:2px}
.procs .pctip[hidden]{display:none}
.procs .pctip .r{display:flex;align-items:center;gap:7px}
.procs .pctip .k{width:12px;border-top:2px solid;flex:none}
.procs .pctip .k.d{border-top-style:dashed}
.procs .pctip b{color:var(--text);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.acct{padding:14px 16px 16px;display:grid;gap:12px;font-size:13px}
.acct .part{display:grid;gap:12px}
.acct .cloud:not(:first-child){border-top:1px solid var(--line);padding-top:12px}
.acct .code{font:900 22px var(--mono);letter-spacing:.14em}
.acct .cloud .lead{font-weight:700}
.acct .cloud .why{margin:0;padding-left:1.2em;display:grid;gap:5px;font-size:13px}
.acct .cloud .why li::marker{color:var(--accent)}
.acct .cloud a{color:var(--accent);overflow-wrap:anywhere}
.acct .relay{font-weight:700;color:var(--muted)}
/* connectors: one row each, a coloured dot for its state, sign-in first */
.mcp .part{gap:8px}
.mcp .conn{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.mcp .conn .ct{display:flex;align-items:center;gap:8px;min-width:0}
.mcp .conn .ct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcp .conn .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.mcp .conn.st-ok .dot{background:var(--run)}
.mcp .conn.st-auth .dot,.mcp .conn.st-warn .dot{background:var(--wait)}
.mcp .conn.st-failed .dot{background:var(--block)}
.mcp .conn .src{font-size:10.5px;font-weight:800;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;flex:none}
.mcp .conn .state{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.mcp .conn.st-ok .state{color:var(--run)}
.mcp .conn.st-auth .state,.mcp .conn.st-warn .state{color:var(--wait)}
.mcp .conn.st-failed .state{color:var(--block)}
.mcp .conn .where{font:11.5px var(--mono);color:var(--faint);overflow-wrap:anywhere}
.mcp .conn .why{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mcp .conn .acts{margin-top:2px}
.acct .relay.on{color:var(--run)}
.acct .me{display:grid;gap:2px}
.acct .me b{font-size:15px;font-weight:900}
.acct .me .mail{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.acct .me .org{font-size:12px;color:var(--muted)}
.acct .plan{justify-self:start;font-size:11px;font-weight:900;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px;margin-top:4px}
.acct h4{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.acct .lim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.acct .lim .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.acct .lim .bar i{display:block;height:100%;background:var(--run)}
.acct .lim.warn .bar i{background:var(--wait)}
.acct .lim.full .bar i{background:var(--block)}
.acct .lim .pct{font-weight:900;font-variant-numeric:tabular-nums}
.acct .lim .reset{grid-column:1/-1;font-size:11.5px;color:var(--faint)}
.acct .src,.acct .hint{font-size:11.5px;color:var(--faint)}
.acct .wait{font-size:12.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:8px;padding:8px 10px}
.acct .bad{color:var(--block);font-weight:700}
.acct .acts{display:flex;gap:8px;flex-wrap:wrap}
.acct .acts button{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:6px 12px;font:700 12.5px var(--sans);cursor:pointer}
.acct .acts button:disabled{opacity:.5;cursor:default}
.acct .acts .main{border-color:var(--run);background:var(--run);color:var(--surface)}
.acct .acts .danger{margin-left:auto;color:var(--block);border-color:var(--block)}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 11.5px var(--sans);padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.menuwrap{position:relative}
.menu-btn{display:grid;place-items:center;padding:5px 9px}
.menu-btn svg{width:16px;height:16px;display:block}
#proc-btn{display:inline-flex;align-items:center;gap:5px}
#proc-btn svg{width:13px;height:13px;flex:none}
.menu-btn[aria-expanded="true"]{color:var(--text);border-color:var(--text)}
.hmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:250px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.25);padding:6px;display:grid;gap:2px}
.hmenu[hidden]{display:none}
.hmenu .mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px}
.hmenu .ml{font:700 12px var(--sans);color:var(--muted)}
.hmenu .mi{appearance:none;border:0;background:none;color:var(--text);text-align:left;font:700 13px var(--sans);padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px}
.hmenu .mi svg{width:16px;height:16px;flex:none;color:var(--muted)}
.hmenu .mi:hover,.hmenu .mi:focus-visible{background:var(--surface-2)}
.hmenu .mrow+.mi{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;border-radius:0 0 9px 9px}

/* the assistant: a floating button (bottom right) and a chat that opens above it, like a messaging app */
.fab{position:fixed;right:20px;bottom:20px;z-index:41;width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--accent);color:#0c1020;box-shadow:0 8px 24px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:40px;height:40px}
.fab.open{background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong)}
.fab .fbadge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--block);color:#fff;font:800 11px/20px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.fab .fbadge[hidden]{display:none}
.fab .flabel{display:none}
@media (min-width:721px){ .fab{width:auto;border-radius:28px;padding:0 18px 0 8px;display:flex;align-items:center;gap:4px;font:800 14px var(--sans)} .fab .flabel{display:inline} }
@media (max-width:640px){ .assist{left:0;right:0;top:0;bottom:0;width:auto;height:auto;border-radius:0;border:0} }
.approvals{bottom:88px}   /* above the button */
.assist{position:fixed;right:20px;bottom:88px;z-index:42;width:min(400px,calc(100vw - 40px));height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
.assist[hidden]{display:none}
.assist .ahd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.assist .ahd svg{width:34px;height:34px;flex:none}
.assist .ahd .who{flex:1;min-width:0}
.assist .ahd b{display:block;font-size:14.5px}
.assist .ahd .sub{font-size:11.5px;color:var(--muted)}
.assist .ahd select{font:12px var(--sans);color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:3px 8px}
.assist .ahd .x{appearance:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);cursor:pointer;display:grid;place-items:center}
.assist .ahd .x svg{width:14px;height:14px}
.assist .alist{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.assist .bub{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.assist .bub.me{align-self:flex-end;background:var(--accent);color:#0c1020;border-bottom-right-radius:4px;white-space:pre-wrap}
.assist .bub.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.assist .bub.ai p{margin:0 0 .5em}.assist .bub.ai p:last-child{margin:0}
.assist .bub.ev{align-self:center;max-width:94%;background:transparent;border:1px dashed var(--line-strong);color:var(--muted);font-size:12px;white-space:pre-wrap}
.assist .notice{align-self:stretch;border-radius:12px;padding:8px 11px;font-size:12.5px;border:1px solid var(--accent);background:var(--accent-soft)}
.assist .notice.warn{border-color:var(--wait);background:var(--wait-soft)}
.assist .tchip{align-self:flex-start;font:11px var(--mono);color:var(--faint)}
.assist .typing{align-self:flex-start;color:var(--muted);font-size:12px}
.assist .hello{color:var(--muted);font-size:13px;text-align:center;margin:auto 10px}
.assist .ts{font-size:10px;color:var(--faint);margin-top:2px}
.assist .afoot{padding:8px 10px 10px;border-top:1px solid var(--line);flex:none}
/* the assistant's settings: sections under the header — what it runs on, what it may do, what it is told, its look */
.assist .asettings{display:grid;gap:10px;align-content:start;padding:10px 12px 12px;border-bottom:1px solid var(--line);flex:none;max-height:62%;overflow:auto;background:var(--bg)}
.assist .asettings[hidden]{display:none}
.assist .ahd .x.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.assist .aset{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12.5px}
.assist .aset h4{margin:0;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.assist .arun{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.assist .afield{display:grid;gap:4px;min-width:0}
.assist .aflabel{font-size:11px;color:var(--faint)}
.assist .afield .modelpick{display:grid;gap:6px}
.assist .afield .modelpick input{font:12px var(--sans);color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;min-width:0}
/* a select drawn as the page's own (fancySelect) */
.fsel{position:relative;display:inline-block;vertical-align:middle;min-width:0;max-width:100%}
.fsel > select[hidden]{display:none}
.fbtn:disabled{opacity:.5;cursor:default}
.fpop[popover]{inset:auto;margin:0;color:var(--text)}
/* the same select in each place it is used, as that place had it */
.assist .arun .fsel,.newagent .row .fsel{display:block}
form.inline .fsel{flex:0 1 150px}
form.inline .fbtn{font:13px var(--sans);background:var(--surface);border-radius:6px;padding:5px 8px}
.detail .actl .fbtn,.newagent .fbtn,.procs .pbar .fbtn{font:13px var(--sans);border-radius:6px;padding:4px 8px}
.composer .fsel{max-width:190px}
.composer .fbtn{border-radius:999px;background:var(--surface);padding:5px 10px 5px 12px;font:700 12px var(--sans)}
.composer .fbtn:hover{border-color:var(--text)}
.fbtn{appearance:none;width:100%;display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:0;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:5px 8px;font:600 12px var(--sans);cursor:pointer;text-align:left}
.fbtn:hover{border-color:var(--accent)}
.fbtn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fbtn .fv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn svg{width:12px;height:12px;flex:none;color:var(--muted)}
.fpop{position:fixed;z-index:80;max-height:min(320px,60vh);overflow:auto;padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);display:grid;gap:1px}
.fpop .fgrp{padding:6px 8px 2px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.fpop .fopt{appearance:none;border:0;background:none;color:var(--text);text-align:left;padding:6px 26px 6px 8px;border-radius:6px;font:12.5px var(--sans);cursor:pointer;position:relative;white-space:nowrap}
.fpop .fopt:hover,.fpop .fopt:focus{background:var(--surface-2);outline:none}
.fpop .fopt[aria-selected="true"]{color:var(--accent);font-weight:700}
.fpop .fopt[aria-selected="true"]::after{content:"✓";position:absolute;right:8px}
/* answering: three steps side by side */
.assist .aseg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.assist .aseg button{appearance:none;border:0;background:none;color:var(--muted);border-radius:7px;padding:6px 4px;font:700 12px var(--sans);cursor:pointer}
.assist .aseg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.assist .ahint{font-size:11.5px;line-height:1.45;color:var(--faint)}
/* what it is told: switches */
.assist .achecks{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.assist .acheck{display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--text);cursor:pointer;padding:4px 0;min-width:0}
.assist .acheck span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assist .acheck input{appearance:none;flex:none;width:28px;height:16px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.assist .acheck input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.assist .acheck input:checked{background:var(--accent)}
.assist .acheck input:checked::after{transform:translateX(12px)}
.assist .acheck input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.assist .aset .status{font-size:11.5px;min-height:1em}
.assist .ahead{display:flex;align-items:center;justify-content:space-between;gap:8px}.assist .alook .avatar-pick{display:flex;gap:10px;align-items:center}
.assist .alook .apreview{width:56px;height:56px;flex:none;border-radius:10px;background:var(--floor);display:grid;place-items:center}
.assist .alook .apreview svg{width:48px;height:48px}
.assist .alook .swatches,.assist .alook .gear{display:flex;flex-wrap:wrap;gap:5px}
.assist .alook .pickcol{display:grid;gap:6px;min-width:0}
.assist .alook .sw{appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.assist .alook .sw[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.assist .alook .gb{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 8px;font:700 11px var(--sans);cursor:pointer}
.assist .alook .gb[aria-pressed="true"]{color:var(--surface);background:var(--text);border-color:var(--text)}
.assist .alook .lfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.assist .alook .save{appearance:none;border:1px solid var(--run);background:var(--run);color:var(--surface);border-radius:8px;padding:5px 12px;font:700 12px var(--sans);cursor:pointer}

      if (!m || ta.selectionStart !== ta.value.length) return close();

      shown = q;
      if (menu.hidden) { menu.replaceChildren(el('div', 'sempty', t('slashLoading'))); menu.hidden = false; }

  /* ── Dock ── agent dialogs minimised along the bottom; a click opens one, a click on the open one folds it again */
  const dockBox = $('dock');

  const assistBox = $('assist'), fabBox = $('fab');

  function undock(name) {

  async function boardEdit(p, body) {
    const send = () => fetch('/api/board', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ project: p.key, ...body }) });
    let r;
    try { r = await send(); if (r.status === 403) { await refreshToken(); r = await send(); } } catch (e) { r = null; }
    notice(!r ? t('failed') : r.status === 409 ? t('boardChanged') : r.ok ? '' : t('failed'));
    clearTimeout(timer); tick();
    return !!(r && r.ok);
  }
  // an inline form; while it is open the board is not redrawn, so typing is never thrown away
  function inlineForm(host, placeholder, onSend, extra) {
    const f = el('form', 'inline');
    f.dataset.editing = '1';
    const input = document.createElement('input');
    input.placeholder = placeholder;
    input.setAttribute('aria-label', placeholder);
    f.append(input);
    if (extra) f.append(extra);
    const ok = el('button', 'ok', t('send')); ok.type = 'submit';
    const no = el('button', 'no', t('cancel')); no.type = 'button';
    no.addEventListener('click', () => { f.remove(); clearTimeout(timer); tick(); });
    f.addEventListener('submit', async (e) => { e.preventDefault(); if (!input.value.trim()) return; ok.disabled = true; if (await onSend(input.value.trim(), f)) f.remove(); else ok.disabled = false; });
    f.append(ok, no);
    host.append(f);
    input.focus();
    return f;
  }
  function decisionControls(p, it, row, tt) {
    if (it.answer) { const a = el('div', 'answer', '↳ ' + str(it.answer)); tt.append(a); }

  function queueControls(p, it, items, row) {
    const queued = items.filter((x) => x.status === 'queued');
    const at = queued.indexOf(it);
    const move = (d) => {
      const next = queued.slice();
      const j = at + d;
      if (j < 0 || j >= next.length) return;
      [next[at], next[j]] = [next[j], next[at]];
      boardEdit(p, { op: 'reorder', order: next.map((x) => x._i), titles: next.map((x) => x.title) });
    };
    const up = el('button', 'mini', '▲'); up.type = 'button'; up.title = t('moveUp'); up.disabled = at === 0; up.addEventListener('click', () => move(-1));
    const dn = el('button', 'mini', '▼'); dn.type = 'button'; dn.title = t('moveDown'); dn.disabled = at === queued.length - 1; dn.addEventListener('click', () => move(1));
    const box = el('span', 'moves'); box.append(up, dn);
    row.append(box);

  function boardPanel(p) {
    const b = p.board;

    if (b && b.updatedAt) h.append(el('span', 'n', t('boardUpdated', { t: dur(Date.parse(b.updatedAt)) })));

      // every project gets the same layout — say how to fill it rather than leaving a gap
      panel.append(el('div', 'empty', t('noBoard', { f: 'boards/' + p.key + '.json' })), addTaskForm(p));
      return panel;
    }
    const tasks = Array.isArray(b.tasks) ? b.tasks : [];
    // the leader writes "-0f" or a full session name — show the nickname when there is one
    const nickOf = (v) => { const s = p.sessions.find((x) => x.short === v || x.name === v || x.nick === v || x.nickKo === v); return s ? nickFor(s) : v; };
    const cols = el('div', 'kcols');
    const column = (cls, title, items, withPos, limit, count) => {
      const c = el('div', 'kcol ' + cls);
      const hh = el('h4', null, title); hh.append(el('span', 'n', String(count ?? items.length)));
      c.append(hh);
      let q = 0;
      for (const it of items.slice(0, limit)) {
        const st = str(it.status);
        const row = el('div', 'task' + (st === 'blocked' ? ' blocked' : '') + (st === 'done' ? ' done' : ''));
        if (withPos && st === 'queued') row.append(el('span', 'pos', String(++q)));
        const tt = el('span', 'tt', (st === 'done' || it._made ? '✓ ' : st === 'blocked' ? '■ ' : '') + str(it.title));
        row.append(tt);
        // a decision an agent already made: who and when, nothing to answer
        if (it._made) { row.classList.add('made'); row.append(el('span', 'ss', t('decidedBy', { x: /^(user|human|you)$/i.test(str(it.by)) ? t('byUser') : nickOf(str(it.by)) || '?', t: it.at ? ago(time(it.at)) : '' }))); }
        if (it.session) row.append(el('span', 'ss', nickOf(str(it.session))));
        if (it._dec) decisionControls(p, it, row, tt);
        if (cls === 'k-queue' && st === 'queued') queueControls(p, it, items, row);
        c.append(row);
      }
      if (items.length > limit) c.append(el('div', 'more', t('more', { n: items.length - limit })));
      if (!items.length) c.append(el('div', 'more', t('none')));
      if (cls === 'k-queue') c.append(addTaskForm(p));
      return c;
    };
    const time = (v) => Date.parse(str(v)) || 0;
    const byOrder = (a, c) => (Number(a.order) || 999) - (Number(c.order) || 999);
    // a decision is a question for a human: { title, status: open | answered, answer }. An entry with only { text, by, at }
    // records one an agent already made; it is listed after the questions, newest first, as decided
    const allDec = (Array.isArray(b.decisions) ? b.decisions : []).map((d, i) => ({ ...d, _i: i })).filter((d) => d && d.status !== 'closed');
    const isRecord = (d) => !d.title && d.text && !d.status;
    const dec = allDec.filter((d) => !isRecord(d))
      .map((d) => ({ title: d.title || d.text, status: d.status === 'answered' ? 'answered' : 'queued', order: d.order, answer: d.answer, _i: d._i, _dec: true })).sort(byOrder);
    const made = allDec.filter(isRecord).sort((a, c) => time(c.at) - time(a.at)).map((d) => ({ title: d.text, by: d.by, at: d.at, _made: true }));
    const indexed = tasks.map((x, i) => ({ ...x, _i: i }));
    // decisions come first: nothing behind them can move until a human answers
    cols.append(
      column('k-dec', '? ' + t('decisions'), [...dec, ...made], true, 12, dec.filter((d) => d.status !== 'answered').length),
      column('k-run', '▶ ' + t('inProgress'), indexed.filter((x) => x.status === 'running'), false, 12),
      column('k-queue', '○ ' + t('queued'), indexed.filter((x) => x.status === 'queued' || x.status === 'blocked')
        .sort((a, c) => (a.status === 'blocked') - (c.status === 'blocked') || byOrder(a, c)), true, 30),
      column('k-done', '✓ ' + t('done'), indexed.filter((x) => x.status === 'done').sort((a, c) => time(c.doneAt) - time(a.doneAt)), false, 8),
    );
    panel.append(cols);
    return panel;
  }

    };

      const [info, cloud] = await Promise.all([part === 'claude' ? read('/api/account', fresh) : null, part === 'cloud' ? read('/api/cloud', fresh) : null]);
      if (!body.isConnected) return;
      // redraw only when something changed, so a button being pressed is not replaced under the pointer
      const key = JSON.stringify([info, cloud, failed, cloudFailed, lang]);

    };

    const cloudAct = async (pathname, ask) => {

    };
    const act = async (pathname, ask) => {
      if (ask && !confirm(ask)) return;

      failed = !(await agentCall(pathname, {}));

    };
    const button = (cls, label, fn) => { const b = el('button', cls, label); b.type = 'button'; b.addEventListener('click', fn); return b; };
    const money = (m) => m ? (m.currency === 'USD' ? '$' : m.currency + ' ') + m.amount.toFixed(2) : '';
    function draw(info) {

      if (!info) { if (!failed) claude.append(el('div', 'bad', t('acctFailed'))); acts.append(button('', t('refresh'), () => load(true))); claude.append(acts); return; }

  const secsLeft = (a) => Math.max(0, Math.round((a.expiresAt - Date.now()) / 1000));
  function approvalsNode(data) {
    openIds = new Set((data.approvals || []).map((a) => a.id));
    for (const [id, c] of liveCards) if (!openIds.has(id) && !c.leaving) liveCards.delete(id);
    // a session whose conversation is open shows its requests there, not in the floating stack
    const inline = liveCtl && liveCtl.visible() ? liveCtl.name : null;

  // the keys answer the first request still open on screen — inside the agent dialog while that is open
  function keyedCard() {
    const d = $('detail');
    return [...(d.open ? d : document).querySelectorAll('.approval')]
      .find((c) => c.keys && c.getClientRects().length && c.querySelector('.acts button:not(:disabled)'));
  }
  function markKeyed() { const k = keyedCard(); for (const c of document.querySelectorAll('.approval')) c.classList.toggle('keyed', c === k); }
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.isComposing) return;
    const card = keyedCard();
    if (!card) return;
    // while typing a message the keys need Alt; Enter in the card's own "other" box sends the answers
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    const inOther = typing && typing.classList.contains('other') && card.contains(typing);
    if (typing && !e.altKey && !(inOther && e.key === 'Enter')) return;
    const m = /^(Digit|Numpad)([1-9])$/.exec(e.code);
    let done = false;
    if (m && !(e.altKey && m[1] === 'Numpad')) done = card.keys.pick(+m[2] - 1);   // Alt+keypad types a character on Windows
    else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) done = !!card.keys.send?.();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') done = !!card.keys.move?.(e.key === 'ArrowDown' ? 1 : -1);
    if (done) { e.preventDefault(); markKeyed(); }
  });
  // every request card on screen, by id: a card is built once and moved between the floating stack and an agent's
  // conversation, so a choice being made or an answer being typed survives other requests coming and going
  const liveCards = new Map();
  let openIds = new Set();   // every request still open, whichever box shows it
  // a card someone was answering, taken away (its time ran out and it went back to VS Code, or it was answered
  // there): it says so for a few seconds instead of vanishing
  function leaveCard(c) {
    c.leaving = true;
    const acts = c.querySelector('.acts');
    if (acts) acts.replaceChildren(el('div', 'done bad', t('goneWhile')));
    for (const k of c.querySelectorAll('.keys')) k.remove();
    setTimeout(() => { c.remove(); liveCards.delete(c.dataset.id); markKeyed(); }, 8000);
  }
  function approvalsInto(box, list) {
    // rebuild only when the set of requests changes, so a click in progress is not thrown away
    const ids = list.map((a) => a.id).join(',');
    if (box.dataset.ids === ids) {
      for (const a of list) { const n = box.querySelector('[data-id="' + a.id + '"] .left'); if (n) n.textContent = t('left', { n: secsLeft(a) }); }
      return;
    }
    box.dataset.ids = ids;
    const now = new Set(list.map((a) => a.id));
    // gone from every list, not just moved to the other box
    for (const c of box.children) if (c.dataset.id && !now.has(c.dataset.id) && !openIds.has(c.dataset.id) && c.touched && !c.answered && !c.leaving) leaveCard(c);
    box.replaceChildren(...[...box.children].filter((c) => c.leaving));
    for (const a of list) {
      const kept = liveCards.get(a.id);
      if (kept && !kept.leaving) { box.append(kept); continue; }
      const card = el('div', 'approval');
      card.dataset.id = a.id;
      liveCards.set(a.id, card);
      // touched: someone started answering it (see leaveCard)
      for (const ev of ['pointerdown', 'input', 'keydown']) card.addEventListener(ev, () => { card.touched = true; }, true);
      const main = el('div');
      const who = el('div', 'who');

      // one entry per question: the picked labels plus any typed answer
      const picks = [];
      const qBoxes = [];   // for the keyboard: each question's options, and whether it takes several
      if (a.questions) {
        const qs = el('div', 'qs');
        a.questions.forEach((q, qi) => {
          const pick = { labels: new Set(), other: null };
          picks.push(pick);
          const box = el('div', 'q');

          qh.append(el('span', 'qt', str(q.question)));
          if (q.multiSelect) qh.append(el('span', 'multi', t('pickMany')));
          const opts = el('div', 'opts');

      }
      const collect = () => picks.map((p, i) => {

            let w = acts.querySelector('.warn');

            w.textContent = t('needAnswers');
            return;
          }
          for (const x of acts.querySelectorAll('button')) x.disabled = true;
          card.answered = true;   // answered here: when it goes away, that is why
          const send = () => fetch('/api/decide', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ id: a.id, answer, pick, answers }) });
          let status = 0;
          try {

            status = r.status;
          } catch (e) { status = 0; }
          // say what happened right on the card, then let the next poll clear it
          const done = el('div', 'done ' + (status === 200 ? 'ok' : 'bad'),
            status === 200 ? t(kind === 'plan' && answer === 'allow' ? 'didPlan' : kind === 'plan' && answer === 'deny' ? 'didKeep' : { allow: 'didAllow', always: 'didAlways', deny: 'didDeny', stop: 'didStop', answers: 'didAnswer' }[answer] || 'didEditor') : status === 404 ? t('gone') : t('failed'));

  // one desktop notification per limit when it passes 80 % and again at 95 %, remembered until that limit resets
  function alertUsage(u) {
    if (inApp || !u || !window.Notification || Notification.permission !== 'granted') return;
    let told = {};
    try { told = JSON.parse(localStorage.getItem('am.usageTold') || '{}'); } catch (e) {}
    const next = {};
    for (const x of u.limits || []) {
      const k = x.kind + '|' + str(x.model) + '|' + str(x.resetsAt).slice(0, 16), lv = usageLevel(x);
      next[k] = Math.max(lv, told[k] || 0);
      if (lv > (told[k] || 0)) {
        const at = Date.parse(x.resetsAt);
        try { new Notification(t('usageAlert', { p: Math.round(x.percent), x: limLabel(x) }), { body: at > Date.now() ? t('usageAlertBody', { t: until(at), at: clock(at) }) : '', tag: 'usage-' + x.kind }); } catch (e) {}
      }
    }
    try { localStorage.setItem('am.usageTold', JSON.stringify(next)); } catch (e) {}
  }

  // a new tab order: shown at once (tabs and the all-agents view follow data.projects), then kept in config.json
  let dragKey = null;
  function moveProject(key, target, after) {
    if (!last) return;
    const list = last.projects.filter((p) => p.key !== key), moved = last.projects.find((p) => p.key === key);
    if (!moved) return;
    const i = list.findIndex((p) => p.key === target);
    list.splice(i < 0 ? list.length : i + (after ? 1 : 0), 0, moved);
    last.projects = list;
    lastSig = '';
    agentCall('/api/order', { order: list.map((p) => p.key) });
    dragKey = null;
    render(last);
  }

  function render(data) {
    if (dragKey) { last = data; return; }   // a tab is being dragged: redrawing now would drop it
    alertUsage(data.usage);
    looks.clear();
    for (const p of data.projects || []) for (const x of p.sessions) if (x.avatar) looks.set(x.name, x.avatar);
    if (assistLook) looks.set('monitor-assistant', assistLook);
    approvalsNode(data);
    last = data;
    for (const f of settingSyncs) f(data);
    const all = data.projects.flatMap((p) => p.sessions);
    const n = (st) => all.filter((s) => s.state === st).length;
    const totals = $('totals');
    // pointed at (or focused), a pill lists what it counts: the projects, or the agents with their project; an agent
    // there opens its dialog, a project its tab
    const pill = (cls, g, label, v, rows) => {
      const x = el('span', 'pill ' + cls);
      x.append(el('span', 'g', g), document.createTextNode(label + ' '), el('b', null, String(v)));
      if (rows.length) {
        x.tabIndex = 0;
        const pop = el('div', 'pillpop');

          const b = el('button', 'pi');

          const txt = el('span', 'ptx');
          txt.append(el('span', 'pn', r.name), el('span', 'ps', r.sub));
          b.append(r.bot ? r.bot() : el('span', 'pnobot'), txt);
          b.addEventListener('click', r.go);
          pop.append(b);
        }
        if (rows.length > 40) pop.append(el('div', 'pmore', '+' + (rows.length - 40)));
        x.append(pop);
      }
      return x;
    };
    const agentRows = (st) => data.projects.flatMap((p) => p.sessions.filter((s) => !st || s.state === st).map((s) => ({
