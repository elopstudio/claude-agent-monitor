  }
  function assistOptsBox(o) {
    o = o || {};
    let approve = ['off', 'read', 'project'].includes(o.approve) ? o.approve : 'project';
    const seg = el('div', 'aseg');
    seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', t('aApprove'));
    const hint = el('div', 'ahint');
    const status = el('span', 'status');
    const boxes = {};
    const save = async () => {
      const body = { approve };
      for (const [k, c] of Object.entries(boxes)) body[k] = c.checked;
      const r = await agentCall('/api/assistant/settings', body);
      status.textContent = r ? t('saved') : t('failed');
      status.className = 'status ' + (r ? 'good' : 'bad');
    };
    const steps = ['off', 'read', 'project'].map((k) => {
      const b = el('button', null, t('aApprove_' + k));
      b.type = 'button';
      b.addEventListener('click', () => { if (approve === k) return; approve = k; draw(); save(); });
      seg.append(b);
      return [k, b];
    });
    const draw = () => { for (const [k, b] of steps) b.setAttribute('aria-pressed', String(k === approve)); hint.textContent = t('aApproveHint_' + approve); };
    draw();
    const head = el('div', 'ahead');
    head.append(el('h4', null, t('aApprove')), status);
    const answering = el('section', 'aset');
    answering.append(head, seg, hint);
    const checks = el('div', 'achecks');
    for (const k of ['asks', 'waiting', 'finished', 'failed', 'stuck', 'login', 'usage']) {
      const c = document.createElement('input');
      c.type = 'checkbox'; c.checked = o[k] !== false;
      c.setAttribute('role', 'switch');
      c.addEventListener('change', save);
      const l = el('label', 'acheck');
      l.append(el('span', null, t('aEv_' + k)), c);
      boxes[k] = c; checks.append(l);
    }
    const told = el('section', 'aset');
    told.append(el('h4', null, t('aEvents')), checks, el('div', 'ahint', t('aEventsHint')));
    return [answering, told];
  }  // in its settings, under mode, model and effort: colour and headgear, the crown among them
  function assistLookBox() {
    const box = el('section', 'aset alook');
    const lp = lookPicker({ avatar: assistLook || { c: 6, acc: 'crown' } }, { crown: true });
    const status = el('span', 'status');
    const save = el('button', 'save', t('saveLook'));
    save.type = 'button';
    const put = async (avatar) => {
      const r = await agentCall('/api/agents/settings', { id: 'assistant', avatar });
      status.textContent = r ? t('saved') : t('failed');
      status.className = 'status ' + (r ? 'good' : 'bad');
      if (r) setAssistLook(avatar);
    };
    save.addEventListener('click', () => put(lp.get().avatar));
    const foot = el('div', 'lfoot');
    foot.append(status, save);
    box.append(el('h4', null, t('avatarLabel')), lp.box, foot);
    return box;
  }
  function assistInit() {
    const fab = $('fab');
    fab.title = t('assistOpen'); fab.setAttribute('aria-label', t('assistOpen'));
    fab.prepend(assistBot(), el('span', 'flabel', t('assistTitle')));
    fab.addEventListener('click', () => assistToggle(!assist.open));
    // one there from before: listen at once, for the badge and the alerts
    fetch('/api/assistant?token=' + encodeURIComponent(token)).then((r) => (r.ok ? r.json() : null)).then((j) => {
      if (j && j.assistant) { assist.exists = true; setAssistLook(j.assistant.avatar); assistConnect(); }
    }).catch(() => {});
  }
  assistInit();
  $('acct-btn').addEventListener('click', () => showAccount('claude'));
  $('cloud-btn').addEventListener('click', () => showAccount('cloud'));
  $('mcp-btn').addEventListener('click', showConnectors);
  $('about-btn').addEventListener('click', showAbout);
  $('bell').addEventListener('click', async () => { try { await Notification.requestPermission(); } catch (e) {} bell(); });
  bell();
  applyStatic();

  let timer = null, lastSig = '', lastDraw = 0;
  async function refreshToken() {
    try { const d = await (await fetch('/api/state?visible=1', { cache: 'no-store' })).json(); if (d.token) token = d.token; } catch (e) {}
  }
  async function tick() {
    try {
      // the language goes along, so the sessions are told which one to write to the person in
      const r = await fetch('/api/state?visible=' + (document.hidden ? 0 : 1) + '&lang=' + lang, { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      const data = await r.json();
      if (data.token) token = data.token;
      // nothing changed: leave the page as it is (redrawn every 30 s anyway, for the relative times,
      // and every time while a request's countdown runs)
      const sig = JSON.stringify({ ...data, now: 0, token: '', hooks: null });
      if (sig !== lastSig || (data.approvals || []).length || Date.now() - lastDraw > 30000) { lastSig = sig; lastDraw = Date.now(); render(data); }
      else last = data;
      alertAsks(data);
      setLive(true); notice('');
    } catch (e) {
      setLive(false); notice(t('noServer'));
    }
    timer = setTimeout(tick, document.hidden ? POLL_MS * 5 : (last?.approvals?.length ? FAST_MS : POLL_MS));
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); tick(); } });
  try {
    const es = new EventSource('/api/events');
    es.addEventListener('changed', () => { clearTimeout(timer); tick(); });
  } catch (e) {}

  // while the tab is in the background, say so in its title — and on the desktop if notifications are allowed
  let seenAsks = new Set(), seenStalls = new Set();
  function alertAsks(data) {
    const list = data.approvals || [];
    const count = list.length + (data.inEditor || []).length;
    document.title = (count ? '(!' + count + ') ' : '') + t('title');
    const fresh = list.filter((a) => !seenAsks.has(a.id));
    seenAsks = new Set(list.map((a) => a.id));
    // an agent that starts to look stuck is told once, until it moves again
    const stalled = (data.projects || []).flatMap((p) => p.sessions).filter((x) => x.stalledFor);
    const newStalls = stalled.filter((x) => !seenStalls.has(x.name));
    seenStalls = new Set(stalled.map((x) => x.name));
    if (inApp || !window.Notification || Notification.permission !== 'granted') return;
    if (document.hidden) for (const x of newStalls) { try { const n = new Notification(t('stallNotify', { x: nickFor(x) || str(x.name) }), { body: t('stallLong', { t: dur(Date.now() - x.stalledFor) }), tag: 'stall-' + x.name }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) {} }
    if (!fresh.length || !document.hidden) return;
    try {
      if (window.Notification && Notification.permission === 'granted') {
        for (const a of fresh) {
          const n = new Notification(t('askTitle') + ' · ' + (str(lang === 'ko' && a.nickKo || a.nick) || str(a.session)), { body: str(a.tool) + (a.what ? ' — ' + str(a.what) : ''), tag: a.id });
          n.onclick = () => { window.focus(); n.close(); };
        }
      }
    } catch (e) {}
  }
  tick();
})();
</script>
</body>
