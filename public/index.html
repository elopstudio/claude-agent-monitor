<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Monitor</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f7; --bg-grad:#e7ebf5; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e0e3ea; --line-strong:#c8cdd8;
  --text:#171a21; --muted:#5b6372; --faint:#8d95a3;
  --accent:#3a63d8; --accent-soft:#e9eefc;
  --run:#3a63d8; --run-soft:#e9eefc;
  --wait:#8c6a10; --wait-soft:#f7f0dc;
  --block:#b0341f; --block-soft:#fae8e3;
  --done:#4a5260; --done-soft:#eceef2;
  --claude:#a8502f; --claude-soft:#f8e9e2;
  --bubble:#ffffff; --floor:#eef0f6; --shadow:rgba(20,28,48,.08); --bot-shadow:rgba(20,28,48,.16);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
    --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
    --accent:#86a6f5; --accent-soft:#1d2741;
    --run:#86a6f5; --run-soft:#1d2741;
    --wait:#e0bc5e; --wait-soft:#2f2816;
    --block:#f0907d; --block-soft:#3b201b;
    --done:#a3abb8; --done-soft:#232830;
    --claude:#e8977a; --claude-soft:#35221b;
    --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --bg-grad:#161b26; --surface:#171b22; --surface-2:#1c212a; --line:#2a303b; --line-strong:#3a4250;
  --text:#e8eaef; --muted:#a3abb8; --faint:#737c8a;
  --accent:#86a6f5; --accent-soft:#1d2741;
  --run:#86a6f5; --run-soft:#1d2741;
  --wait:#e0bc5e; --wait-soft:#2f2816;
  --block:#f0907d; --block-soft:#3b201b;
  --done:#a3abb8; --done-soft:#232830;
  --claude:#e8977a; --claude-soft:#35221b;
  --bubble:#1f252f; --floor:#1a1f28; --shadow:rgba(0,0,0,.35); --bot-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
/* thin scrollbars in the page's own colours (Firefox, and Chromium 121+) */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
/* older Chromium / Safari */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:var(--line-strong);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0}
body{background:radial-gradient(1400px 520px at 50% -140px,var(--bg-grad),transparent 70%),var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{--gut:24px;margin:0 auto;padding:0 var(--gut) 60px}
@media (max-width:640px){ .wrap{--gut:16px;padding-bottom:48px} }
/* header, approvals and tabs stay on screen; approvals scroll inside when there are many */
.top .brand-wrap{display:flex;align-items:center;gap:8px}
.sticky{position:sticky;top:0;z-index:20;margin:0 calc(-1 * var(--gut));padding:16px var(--gut) 0;background:var(--bg)}

.mono{font-family:var(--mono)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.brand .name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.for-claude{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--claude);background:var(--claude-soft);border:1px solid color-mix(in srgb,var(--claude) 35%,transparent);white-space:nowrap}
.sub{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint);position:relative}
.live.on i{background:var(--run)}
.live.on i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.totals{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 1px 2px var(--shadow)}
.pill b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.pill .g{font-size:10px}
.pill.run b,.pill.run .g{color:var(--run)}
.pill.wait b,.pill.wait .g{color:var(--wait)}
.pill.rest b,.pill.rest .g{color:var(--faint)}

/* Project tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin:0 0 -1px;padding:0 4px;position:relative;z-index:1}
.tab{appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:9px 14px 10px 8px;border-radius:12px 12px 0 0;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:700}
.tab svg{width:26px;height:26px;flex:none}
.tab .tname{font-family:var(--mono)}
/* the "all agents" label is words, not a folder name */
.tab .tname.all,.project .folder.all{font-family:var(--sans)}
.role-tag,.info .short{white-space:nowrap}
.all-group .bot-card.leader{grid-template-columns:84px minmax(0,1fr)}
.all-group .leader .stage{height:96px}
.all-group .leader .stage .robot{width:72px;height:72px}
.tab .tc{display:inline-flex;gap:4px}
.tab .tc span{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.tab .tc .r{color:var(--run);background:var(--run-soft)}
.tab .tc .w{color:var(--wait);background:var(--wait-soft)}
.tab .all-ico{width:26px;height:26px;display:grid;place-items:center;font-size:15px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.tab .tc .z{color:var(--faint);border:1px dashed var(--line-strong);line-height:15px}

/* Project */
.project{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.project>.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.project .folder{font-family:var(--mono);font-weight:700;font-size:16px}
.project .label{color:var(--muted);font-size:12px}
.project .counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-flex;gap:4px;align-items:center}
.cnt.run{color:var(--run);background:var(--run-soft)}
.cnt.wait{color:var(--wait);background:var(--wait-soft)}
.cnt.rest{color:var(--faint);border:1px dashed var(--line-strong)}
.all-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.all-group>h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.all-group>h3 button{appearance:none;border:0;background:none;padding:0;color:var(--text);font:700 15px var(--mono);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.all-group>h3 button:hover{text-decoration-color:var(--text)}
.all-group>h3 .label{color:var(--muted);font-size:12px;font-weight:500}
.all-group .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}

/* Org chart */
.org{min-width:0}
.tree{position:relative;margin:10px 0 0 42px;padding-left:22px;border-left:2px dashed var(--line-strong);display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tree.flat{margin-left:0;padding-left:0;border-left:0}
.tree:not(.flat)>.bot-card::before{content:"";position:absolute;left:-24px;top:50px;width:22px;border-top:2px dashed var(--line-strong)}
.lead-wrap{max-width:640px}
.role-tag{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--wait);background:var(--wait-soft);border-radius:4px;padding:1px 6px}

.bot-card{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 10px;box-shadow:0 1px 2px var(--shadow);min-width:0;transition:transform .15s,box-shadow .15s}
.bot-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--shadow)}
.bot-card.leader{grid-template-columns:100px minmax(0,1fr);border-color:var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.stage{position:relative;height:96px;border-radius:9px;background:var(--floor);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.leader .stage{height:112px}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,rgba(127,137,160,.10))}
.stage .robot{width:72px;height:72px;position:relative;z-index:1;margin-bottom:8px}
.leader .stage .robot{width:88px;height:88px}
.stage .shadow{position:absolute;bottom:7px;left:50%;width:40px;height:6px;margin-left:-20px;border-radius:50%;background:var(--bot-shadow);filter:blur(1px)}
.st-working .stage .shadow{animation:shadow 1.8s ease-in-out infinite}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.7}}
.info{min-width:0;display:flex;flex-direction:column;gap:5px}
.info .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info .nm{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.who-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.botname{text-align:center;font-weight:900;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .botname{font-size:15px}
.info .short{font-family:var(--mono);font-weight:700;font-size:15px}
.info .nick{font-weight:900;font-size:15px;white-space:nowrap}
.info .full{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
.info .title{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;margin-left:4px;display:flex;gap:7px;align-items:flex-start;
  height:calc(2 * 1.55em + 16px);width:calc(100% - 4px);appearance:none;text-align:left;font-family:inherit;color:inherit;line-height:1.55;cursor:pointer}
.bubble:hover{border-color:var(--text)}
.bubble .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.bubble::before{content:"";position:absolute;left:-6px;top:11px;width:9px;height:9px;background:var(--bubble);border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
.bubble .k{flex:none;font-size:12px;line-height:1.55}
.st-resting .bubble{color:var(--faint);border-style:dashed}
.st-resting .bubble::before{border-left-style:dashed;border-bottom-style:dashed}
.info .when{color:var(--faint);font-size:11px;margin-left:4px;display:flex;flex-wrap:wrap;gap:2px 8px;white-space:nowrap;min-width:0}
/* a narrow card wraps to a second line instead of cutting each item short; only an item wider than the card gets an ellipsis */
.info .when>span{overflow:hidden;text-overflow:ellipsis;max-width:100%}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge .g{font-size:9px;line-height:1}
.b-run{color:var(--run);background:var(--run-soft)}
.b-wait{color:var(--wait);background:var(--wait-soft)}
.b-block{color:var(--block);background:var(--block-soft);border-color:var(--block)}
.b-done{color:var(--done);background:var(--done-soft)}
.b-rest{color:var(--faint);border-color:var(--line-strong);border-style:dashed}

/* Robots — state is shown by face and motion, not colour */
.robot *{transform-box:view-box}
.robot .rb{transform-origin:32px 60px}
.st-working .robot .rb{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.st-working .robot .eyes{transform-origin:32px 28px;animation:blink 4.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.st-working .robot .arm-l{transform-origin:16.5px 47px;animation:type .45s ease-in-out infinite alternate}
.st-working .robot .arm-r{transform-origin:47.5px 47px;animation:type .45s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.st-working .robot .bulb,.st-working .robot .core{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{opacity:.3}}
.st-waiting .robot .rb{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.robot .zz{font:900 9px var(--sans);fill:var(--muted);opacity:0;animation:float 3s ease-in infinite}
.robot .zz.b{animation-delay:1.5s;font-size:7px}
@keyframes float{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
.st-resting .robot .rb{filter:grayscale(1);opacity:.5}
@media (prefers-reduced-motion:reduce){.robot *,.live i::after,.stage .shadow{animation:none!important}}

/* Side column — team chat and board */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--surface)}
.panel>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint)}
.feed{list-style:none;margin:0;padding:6px 0;max-height:360px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:6px 12px}
.feed .who{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
.feed .who svg{width:18px;height:18px}
.feed .arrow{color:var(--faint);font-weight:500}
.feed .s{font-size:12.5px;overflow-wrap:anywhere}
.feed .t{color:var(--faint);font-size:11px}
.empty{color:var(--faint);font-size:12px;padding:12px;text-align:center}

/* Board — a kanban under the org chart */
.kanban{border-top:1px solid var(--line);padding:12px 16px 16px}
.kanban>h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kanban>h3 .n{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--faint);font-size:11.5px}
.kanban>.empty{border:1px dashed var(--line-strong);border-radius:10px}
.kcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 4px;min-width:0}
.kcol>h4{margin:0 2px 8px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.kcol>h4 .n{margin-left:auto;font-family:var(--mono);color:var(--faint);font-weight:500}
.kcol.k-run{border-top:3px solid var(--run)}
.kcol.k-queue{border-top:3px solid var(--wait)}
.kcol.k-dec{border-top:3px dashed var(--block)}
.kcol.k-done{border-top:3px solid var(--line-strong)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 5px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;position:relative}
.task.blocked{border-color:var(--block);padding-left:13px}
.task.blocked::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:8px 0 0 8px;background:repeating-linear-gradient(45deg,var(--block) 0 3px,transparent 3px 6px)}
.task .pos{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .ss{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.task.done{background:transparent;color:var(--muted)}
.more{font-size:11px;color:var(--faint);padding:0 4px 4px}
.task{flex-wrap:wrap}
.task .answer{display:block;color:var(--run);font-size:12px;margin-top:3px;font-weight:500}
.mini{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:6px;font:700 11px var(--sans);padding:1px 7px;cursor:pointer;flex:none}
.mini:hover:not(:disabled){color:var(--text);border-color:var(--text)}
.mini:disabled{opacity:.35;cursor:default}
.mini.wide{width:100%;padding:5px;margin:2px 0 4px}
.task .moves{display:inline-flex;gap:2px;flex:none}
form.inline{display:flex;gap:5px;flex-wrap:wrap;width:100%;margin:6px 0 2px}
form.inline input,form.inline select{flex:1 1 160px;min-width:0;font:13px var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
form.inline select{flex:0 1 150px}
form.inline button{appearance:none;border-radius:6px;font:700 12px var(--sans);padding:5px 10px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
form.inline button.ok{background:var(--run);border-color:var(--run);color:var(--surface)}

.notice{margin:0 0 16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px}

@media (max-width:1100px){ .pbody{grid-template-columns:1fr} .kcols{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .tree{margin-left:14px;padding-left:14px;grid-template-columns:1fr}
  .tree:not(.flat)>.bot-card::before{left:-16px;width:14px}
  .bot-card,.bot-card.leader{grid-template-columns:76px minmax(0,1fr)}
  .leader .stage .robot{width:72px;height:72px}
  .project .counts{margin-left:0}
  .kcols{grid-template-columns:minmax(0,1fr)}
}

/* Approvals — requests waiting for a click, above everything else */
.approvals{position:fixed;right:20px;bottom:20px;z-index:40;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;display:flex;flex-direction:column;gap:10px;margin:0;padding:4px}
@media (max-width:640px){ .approvals{right:16px;left:16px;bottom:16px;width:auto} }
.approvals:empty{display:none}
.approval{background:var(--surface);border:2px solid var(--wait);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px var(--bot-shadow),0 2px 6px var(--shadow);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center}
.approval .acts{justify-content:flex-start}
.approval .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.approval .who svg{width:24px;height:24px}
.approval .who b{font-weight:900}
.approval .who .agent{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:999px;padding:2px 10px 2px 4px;display:inline-flex;align-items:center;gap:6px;font:inherit;cursor:pointer}
.approval .who .agent:hover{border-color:var(--wait)}
.approval .who .agent svg{width:28px;height:28px}
.approval .who .agent .sh{font-family:var(--mono);font-size:11px;color:var(--faint)}
.approval .about{margin:4px 0 0;font-size:12px;color:var(--muted)}
.bot-card.asking{border:2px solid var(--wait);box-shadow:0 0 0 4px var(--wait-soft)}

.info .marks{display:flex;align-items:center;gap:5px;flex:none}
.mode{font-size:10px;font-weight:900;letter-spacing:.05em;border-radius:4px;padding:1px 6px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.mode.m-auto,.mode.m-bypassPermissions,.mode.m-dontAsk{color:var(--block);border-color:var(--block)}

/* Language switch */
.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bell{appearance:none;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font:700 11.5px var(--sans);padding:5px 11px;cursor:pointer}
.acct{padding:14px 16px 16px;display:grid;gap:12px;font-size:13px}
.acct .me{display:grid;gap:2px}
.acct .me b{font-size:15px;font-weight:900}
.acct .me .mail{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.acct .me .org{font-size:12px;color:var(--muted)}
.acct .plan{justify-self:start;font-size:11px;font-weight:900;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px;margin-top:4px}
.acct h4{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.acct .lim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.acct .lim .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.acct .lim .bar i{display:block;height:100%;background:var(--run)}
.acct .lim.warn .bar i{background:var(--wait)}
.acct .lim.full .bar i{background:var(--block)}
.acct .lim .pct{font-weight:900;font-variant-numeric:tabular-nums}
.acct .lim .reset{grid-column:1/-1;font-size:11.5px;color:var(--faint)}
.acct .src,.acct .hint{font-size:11.5px;color:var(--faint)}
.acct .wait{font-size:12.5px;font-weight:700;color:var(--wait);background:var(--wait-soft);border-radius:8px;padding:8px 10px}
.acct .bad{color:var(--block);font-weight:700}
.acct .acts{display:flex;gap:8px;flex-wrap:wrap}
.acct .acts button{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:8px;padding:6px 12px;font:700 12.5px var(--sans);cursor:pointer}
.acct .acts button:disabled{opacity:.5;cursor:default}
.acct .acts .main{border-color:var(--run);background:var(--run);color:var(--surface)}
.acct .acts .danger{margin-left:auto;color:var(--block);border-color:var(--block)}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 11.5px var(--sans);padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
</style>
</head>

    // a monitor agent: its own stream — text grows in place as it is written, like the VS Code panel
    const blocks = new Map();   // message id + block index → its text element
    const putAgent = (ev) => {
      if (ev.kind === 'state') { agentState = ev.state; if (ev.state !== 'working') thinking = false; if (liveCtl) liveCtl.update(last); if (onAgentState) onAgentState(ev.state); return; }
      if (ev.kind === 'user') return put([{ role: 'user', text: ev.text, files: ev.files, at: ev.at }]);
      if (ev.kind === 'tool') return put([{ role: 'tool', id: ev.id, name: ev.name, action: ev.action, input: ev.input, at: ev.at }]);
      if (ev.kind === 'result') return put([{ role: 'result', id: ev.id, error: ev.error, text: ev.text, at: ev.at }]);
      if (ev.kind === 'note') return put([{ role: 'note', text: ev.text, at: ev.at }]);
      if (ev.kind === 'turn') return put([{ role: 'note', text: (ev.ok ? '✓ ' : '⚠ ') + t('turnDone', { t: (ev.ms / 1000).toFixed(1) }) + (ev.text ? ' — ' + str(ev.text) : ''), at: ev.at }]);
      if (ev.kind === 'block' && ev.type === 'thinking') { thinking = !ev.done; return; }
      if (ev.kind === 'block' && ev.type === 'text') {
        const key = ev.msg + ':' + ev.index;
        let m = blocks.get(key);
        const atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 140;
        if (!m) {
          if (!ev.text) return;
          open.clear();
          m = el('div', 'm assistant');
          m.append(el('div', 'mt md', ''), el('div', 'ts', time(ev.at)));
          blocks.set(key, m);
          add(m);
        }
        m.firstChild.replaceChildren(mdNode(ev.text));
        if (!ev.done) m.classList.add('streaming'); else m.classList.remove('streaming');
        lastAt = ev.at;
        if (atBottom) pane.scrollTop = pane.scrollHeight;
        else jump.hidden = false;
      }
    };
    let onAgentState = null;
    wrap.onAgentState = (fn) => { onAgentState = fn; };
    if (s.managed && !sub) {
      try {
        liveES = new EventSource('/api/agent-stream?id=' + encodeURIComponent(str(s.agentId)) + '&token=' + encodeURIComponent(token));
        liveES.addEventListener('init', (ev) => {
          const d = JSON.parse(ev.data);
          pane.replaceChildren(tail); tools.clear(); open.clear(); blocks.clear();
          for (const e of d.events) putAgent(e);
          agentState = d.state; if (onAgentState) onAgentState(d.state);
          state.textContent = ''; state.className = 'lstate on'; pane.scrollTop = pane.scrollHeight;
          if (liveCtl) liveCtl.update(last);
        });
        liveES.addEventListener('e', (ev) => putAgent(JSON.parse(ev.data)));
        liveES.onerror = () => { state.textContent = t('liveOff'); state.className = 'lstate'; };
      } catch (e) { state.textContent = t('liveOff'); }
      return wrap;
    }
    try {
      const es = new EventSource('/api/live?session=' + encodeURIComponent(str(s.name)) + (sub ? '&sub=' + encodeURIComponent(sub) : '') + '&token=' + encodeURIComponent(token));
      if (sub) subES = es; else liveES = es;
      es.addEventListener('init', (ev) => { pane.replaceChildren(tail); tools.clear(); open.clear(); put(JSON.parse(ev.data)); state.textContent = ''; state.className = 'lstate on'; pane.scrollTop = pane.scrollHeight; });
      es.addEventListener('add', (ev) => put(JSON.parse(ev.data)));
      es.onerror = () => { state.textContent = t('liveOff'); state.className = 'lstate'; };
    } catch (e) { state.textContent = t('liveOff'); }
    return wrap;
  }

  async function agentCall(pathname, body) {
    const go = () => fetch(pathname, { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify(body) });
    try { let r = await go(); if (r.status === 403) { await refreshToken(); r = await go(); } return r.ok ? await r.json() : null; } catch (e) { return null; }
  }
  const MODE_KEYS = ['default', 'acceptEdits', 'plan', 'auto', 'dontAsk', 'bypassPermissions'];
  const MODELS = [['', 'modelDefault'], ['opus', 'Opus'], ['sonnet', 'Sonnet'], ['haiku', 'Haiku']];

    const sel = document.createElement('select');

  }
  function modelSelect(value) {
    const sel = document.createElement('select');
    for (const [k, label] of MODELS) sel.append(new Option(label === 'modelDefault' ? t('modelDefault') : label, k));
    sel.value = MODELS.some(([k]) => k === value) ? value : '';

  // stop, permission mode, model, close — above a monitor agent's conversation

  // a new agent the monitor runs: folder, permission mode, model and the first message
  // name + colour + headgear with a live preview; get() returns { nick, avatar }
  function lookPicker(initial) {
    const nick = document.createElement('input');
    nick.maxLength = 16;

    let look = initial?.avatar || { c: Math.floor(Math.random() * 8), acc: ALL_ACCS[Math.floor(Math.random() * ALL_ACCS.length)] };

      looks.set(key, look);
      preview.replaceChildren(robotNode(key, 'working', false, false));
      for (const b of swatches.children) b.setAttribute('aria-pressed', String(Number(b.dataset.c) === look.c));
      for (const b of gear.children) b.setAttribute('aria-pressed', String(b.dataset.acc === look.acc));

    const box = el('div', 'avatar-pick');

    stopLive();   // a conversation that was open in the dialog is closed first

    const recent = (() => { try { return JSON.parse(localStorage.getItem('am.recentDirs') || '[]'); } catch (e) { return []; } })();
    const project = document.createElement('select');

    project.value = p && seen.has(str(p.root)) ? str(p.root) : (project.options[0]?.value || '__other');

    sync();
    // one level at a time: drives, then folders; files are never listed
    async function openDir(path) {
      const r = await fetch('/api/dirs?path=' + encodeURIComponent(path || '') + '&token=' + encodeURIComponent(token)).then((x) => x.ok ? x.json() : null).catch(() => null);

      const head = el('div', 'dhead');

      head.append(el('span', 'dpath', r.path || t('drives')));
      if (r.path) { const pick = el('button', 'mini pickdir', t('pickThis')); pick.type = 'button'; pick.addEventListener('click', () => { folder.value = r.path; picker.hidden = true; }); head.append(pick); }
      const list = el('div', 'dlist');

      if (!r.dirs.length) list.append(el('div', 'more', t('noFolders')));

    browse.addEventListener('click', () => openDir(folder.value.trim()));
    const mode = modeSelect('default');

    ta.placeholder = t('firstMsg');

    const go = el('button', 'send', t('startAgent'));
    go.type = 'submit';
    const row = (label, node) => { const l = el('label', 'row'); l.append(el('span', null, label), node); return l; };
    form.append(row(t('projectLabel'), project), other, picker, row(t('nickLabel'), nick), row(t('avatarLabel'), avatarBox), row(t('dMode'), mode), row(t('modelLabel'), model), fastLabel, ta, el('div', 'hint', t('newAgentHint')), status, go);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      go.disabled = true;
      const r = await agentCall('/api/agents/start', { cwd: folder.value.trim(), mode: mode.value, model: model.value, text: ta.value.trim(), ...lp.get(), fast: fast.checked });
      if (r && r.name) looks.set(r.name, lp.get().avatar);
      go.disabled = false;
      if (!r || !r.id) { status.textContent = t('startFailed'); status.className = 'status bad'; return; }
      try { const dir = folder.value.trim(); localStorage.setItem('am.recentDirs', JSON.stringify([dir, ...recent.filter((x) => x !== dir)].slice(0, 8))); } catch (e2) {}
      // open its conversation right away; the card appears with the next poll
      showDetail({ name: r.name, short: r.name, nick: lp.get().nick, nickKo: lp.get().nick, avatar: lp.get().avatar, managed: true, agentId: r.id, mode: mode.value, model: model.value, state: 'working', startedAt: Date.now() }, false, 'conv');
      clearTimeout(timer); tick();
    });
    d.replaceChildren(head, form);
    if (!d.open) d.showModal();
    if (approvalsBox.parentNode !== d) d.append(approvalsBox);
    d.classList.add('narrow');
    (project.value === '__other' ? folder : ta).focus();

  // the list of a session's subagents; picking one follows its conversation

        const bottom = el('div', 'sb');
        bottom.append(document.createTextNode((a.activity ? actText(a.activity) + ' · ' : '') + t('subTools', { n: a.tools }) + ' · ' + (a.running ? t('working') : ago(a.lastAt))));
        b.append(top, bottom);

  function showDetail(s, focusMessage, tab) {
    const d = $('detail');
    const st = STATE[s.state] ? s.state : 'resting';
    const project = (last?.projects || []).find((p) => p.sessions.some((x) => x.name === s.name));
    const asked = (last?.approvals || []).find((a) => a.session === s.name);
    const head = el('div', 'dh');
    const who = el('div', 'who');
    who.append(el('b', null, nickFor(s) || str(s.name)), el('span', 'sh', str(s.short) || str(s.name)));
    const close = el('button', 'close', t('close'));
    close.type = 'button';
    close.addEventListener('click', () => d.close());
    head.append(robotNode(str(s.name), st, s.isLeader, false), who, badge(st), close);
    const dl = el('dl');
    const row = (k, v) => { if (v) dl.append(el('dt', null, k), el('dd', null, v)); };
    row(t('dProject'), project ? project.key + (project.label ? ' · ' + project.label : '') : '');
    row(t('dRole'), str(s.role));
    row(t('dTitle'), str(s.title));
    if (asked) row(t('dAsk'), str(asked.tool) + (asked.what ? ' — ' + str(asked.what) : ''));
    if (s.activity) row(st === 'working' ? t('dNow') : t('dLast'), actText(s.activity) + (s.activityAt ? '  (' + ago(s.activityAt) + ')' : ''));
    row(t('dState'), t(st) + (s.statusSince ? ' · ' + dur(s.statusSince) : ''));
    if (s.mode) row(t('dMode'), (I18N[lang].modes || I18N.en.modes)[s.mode] || str(s.mode));
    if (s.startedAt) row(t('dUp'), dur(s.startedAt));
    if (s.context) row(t('dCtx'), s.context.toLocaleString() + ' ' + t('tok'));
    if (s.results) row(t('dErr'), t('errOf', { e: s.errors, n: s.results }) + (s.lastErrorAt ? ' · ' + t('lastErr', { t: ago(s.lastErrorAt) }) : ''));
    if (s.stalledFor) row(t('dStall'), t('stallLong', { t: dur(Date.now() - s.stalledFor) }));
    const form = el('form', 'msg');
    const ta = document.createElement('textarea');
    ta.rows = 3;
    ta.placeholder = t('msgPh', { x: nickFor(s) || str(s.name) });
    ta.setAttribute('aria-label', ta.placeholder);
    const hint = el('div', 'hint', s.managed ? t('msgAgent') : s.listening ? t('msgNow') : st === 'working' ? t('msgAfterTurn') : t('msgNotListening'));
    const status = el('div', 'status');
    const send = el('button', 'send', t('send'));
    send.type = 'submit';
    // attachments: picked, dropped or pasted files are uploaded at once; the message carries their paths
    const files = [];   // { name, size, path | null (uploading), el }
    const chips = el('div', 'chips');
    const picker = document.createElement('input');
    picker.type = 'file'; picker.multiple = true; picker.hidden = true;
    const attachBtn = el('button', 'attach', '📎 ' + t('attach'));
    attachBtn.type = 'button';
    attachBtn.addEventListener('click', () => picker.click());
    const kb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
    async function addFiles(list) {
      for (const file of list) {
        if (files.length >= 5) { status.textContent = t('tooMany'); status.className = 'status bad'; break; }
        if (file.size > 20 * 1048576) { status.textContent = t('tooBig', { x: file.name }); status.className = 'status bad'; continue; }
        const item = { name: file.name || 'pasted.png', size: file.size, path: null, el: el('span', 'chip up') };
        const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', t('remove'));
        x.addEventListener('click', () => { files.splice(files.indexOf(item), 1); item.el.remove(); });
        item.el.append(document.createTextNode(item.name + ' · ' + kb(item.size)), x);
        files.push(item); chips.append(item.el);
        const put = () => fetch('/api/upload?session=' + encodeURIComponent(str(s.name)) + '&name=' + encodeURIComponent(item.name), { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-monitor-token': token }, body: file });
        try {
          let r = await put();
          if (r.status === 403) { await refreshToken(); r = await put(); }
          if (!r.ok) throw new Error(String(r.status));
          item.path = (await r.json()).path;
          item.el.classList.remove('up');
        } catch (e) {
          item.el.classList.add('bad');
          files.splice(files.indexOf(item), 1);
          status.textContent = t('uploadFailed', { x: item.name }); status.className = 'status bad';
        }
      }
    }
    picker.addEventListener('change', () => { addFiles([...picker.files]); picker.value = ''; });
    form.addEventListener('dragover', (e) => { e.preventDefault(); form.classList.add('drop'); });
    form.addEventListener('dragleave', () => form.classList.remove('drop'));
    form.addEventListener('drop', (e) => { e.preventDefault(); form.classList.remove('drop'); addFiles([...e.dataTransfer.files]); });
    ta.addEventListener('paste', (e) => { const fl = [...(e.clipboardData?.files || [])]; if (fl.length) { e.preventDefault(); addFiles(fl); } });
    const sendRow = el('div', 'sendrow');
    sendRow.append(attachBtn, send);
    form.append(ta, chips, picker, hint, status, sendRow);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = ta.value.trim();
      if (files.some((x) => !x.path)) { status.textContent = t('stillUploading'); status.className = 'status bad'; return; }
      if (!text && !files.length) return;
      send.disabled = true;
      const post = () => s.managed
        ? fetch('/api/agents/send', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ id: s.agentId, text, files: files.map((x) => x.path) }) })
        : fetch('/api/message', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ session: s.name, text, files: files.map((x) => x.path) }) });
      let r;
      try { r = await post(); if (r.status === 403) { await refreshToken(); r = await post(); } } catch (e2) { r = null; }
      send.disabled = false;
      if (r && r.ok) { ta.value = ''; files.length = 0; chips.replaceChildren(); status.textContent = t('msgSent'); status.className = 'status good'; clearTimeout(timer); tick(); }
      else { status.textContent = t('failed'); status.className = 'status bad'; }
    });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
    const tabs = el('div', 'dtabs');
    tabs.setAttribute('role', 'tablist');
    const info = el('div', 'dpanel'); info.append(dl, lookEditor(s));
    const conv = el('div', 'dpanel');
    const lp = livePane(s);
    if (s.managed) conv.append(agentControls(s, lp));
    // a stopped monitor agent: start claude now, while the message is being written
    if (s.managed && s.running === false) agentCall('/api/agents/warm', { id: s.agentId });
    conv.append(lp);
    const subs = el('div', 'dpanel');
    subsPanel(s, subs);
    const panels = { info, conv, subs };
    let pick = tab || (() => { try { const v = localStorage.getItem('am.dtab'); return v === 'conv' || (v === 'subs' && (s.subagents || []).length) ? v : 'info'; } catch (e2) { return 'info'; } })();
    const buttons = {};
    const show = (k) => {
      pick = k;
      try { localStorage.setItem('am.dtab', k); } catch (e2) {}
      for (const [key, b] of Object.entries(buttons)) b.setAttribute('aria-selected', String(key === k));
      for (const [key, p] of Object.entries(panels)) p.hidden = key !== k;
      if (k === 'conv') { const lp = conv.querySelector('.lpane'); if (lp) lp.scrollTop = lp.scrollHeight; }
      if (last) approvalsNode(last);
    };
    const nSubs = (s.subagents || []).length;
    for (const [k, label] of [['info', t('tabInfo')], ['conv', t('tabConv')], ...(nSubs ? [['subs', t('tabSubs', { n: nSubs })]] : [])]) {
      const b = el('button', 'dtab', label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.addEventListener('click', () => show(k));
      buttons[k] = b;
      tabs.append(b);
    }

  async function boardEdit(p, body) {

    let r;
    try { r = await send(); if (r.status === 403) { await refreshToken(); r = await send(); } } catch (e) { r = null; }
    notice(!r ? t('failed') : r.status === 409 ? t('boardChanged') : r.ok ? '' : t('failed'));

  // an inline form; while it is open the board is not redrawn, so typing is never thrown away
  function inlineForm(host, placeholder, onSend, extra) {
    const f = el('form', 'inline');
    f.dataset.editing = '1';
    const input = document.createElement('input');
    input.placeholder = placeholder;
    input.setAttribute('aria-label', placeholder);
    f.append(input);
    if (extra) f.append(extra);
    const ok = el('button', 'ok', t('send')); ok.type = 'submit';
    const no = el('button', 'no', t('cancel')); no.type = 'button';
    no.addEventListener('click', () => { f.remove(); clearTimeout(timer); tick(); });
    f.addEventListener('submit', async (e) => { e.preventDefault(); if (!input.value.trim()) return; ok.disabled = true; if (await onSend(input.value.trim(), f)) f.remove(); else ok.disabled = false; });
    f.append(ok, no);
    host.append(f);
    input.focus();
    return f;
  }

  function queueControls(p, it, items, row) {
    const queued = items.filter((x) => x.status === 'queued');
    const at = queued.indexOf(it);
    const move = (d) => {
      const next = queued.slice();
      const j = at + d;
      if (j < 0 || j >= next.length) return;
      [next[at], next[j]] = [next[j], next[at]];
      boardEdit(p, { op: 'reorder', order: next.map((x) => x._i), titles: next.map((x) => x.title) });
    };
    const up = el('button', 'mini', '▲'); up.type = 'button'; up.title = t('moveUp'); up.disabled = at === 0; up.addEventListener('click', () => move(-1));
    const dn = el('button', 'mini', '▼'); dn.type = 'button'; dn.title = t('moveDown'); dn.disabled = at === queued.length - 1; dn.addEventListener('click', () => move(1));

    const load = async (fresh) => {
      const get = () => fetch('/api/account?token=' + encodeURIComponent(token) + (fresh ? '&fresh=1' : ''), { cache: 'no-store' });
      let info = null;
      try { let r = await get(); if (r.status === 403) { await refreshToken(); r = await get(); } info = r.ok ? await r.json() : null; } catch (e) {}
      if (!body.isConnected) return;

    };
    const button = (cls, label, fn) => { const b = el('button', cls, label); b.type = 'button'; b.addEventListener('click', fn); return b; };
    const p2 = (n) => String(n).padStart(2, '0');
    const clock = (ms) => { const x = new Date(ms); return (ms - Date.now() > 20 * 3600e3 ? (x.getMonth() + 1) + '/' + x.getDate() + ' ' : '') + p2(x.getHours()) + ':' + p2(x.getMinutes()); };

      const tier = /max_(\d+x)/i.exec(str(info.tier));

      if (plan) me.append(el('span', 'plan', plan));

        row.append(el('span', null, t('extraUsage')), el('span', 'pct', money(u.extra.used) + (u.extra.limit ? ' / ' + money(u.extra.limit) : '')));

      acts.append(button('', t('refresh'), () => load(true)),

  // the keys answer the first request still open on screen — inside the agent dialog while that is open
  function keyedCard() {
    const d = $('detail');
    return [...(d.open ? d : document).querySelectorAll('.approval')]
      .find((c) => c.keys && c.getClientRects().length && c.querySelector('.acts button:not(:disabled)'));
  }
  function markKeyed() { const k = keyedCard(); for (const c of document.querySelectorAll('.approval')) c.classList.toggle('keyed', c === k); }
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.isComposing) return;
    const card = keyedCard();
    if (!card) return;
    // while typing a message the keys need Alt; Enter in the card's own "other" box sends the answers
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    const inOther = typing && typing.classList.contains('other') && card.contains(typing);
    if (typing && !e.altKey && !(inOther && e.key === 'Enter')) return;
    const m = /^(Digit|Numpad)([1-9])$/.exec(e.code);
    let done = false;
    if (m && !(e.altKey && m[1] === 'Numpad')) done = card.keys.pick(+m[2] - 1);   // Alt+keypad types a character on Windows
    else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) done = !!card.keys.send?.();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') done = !!card.keys.move?.(e.key === 'ArrowDown' ? 1 : -1);
    if (done) { e.preventDefault(); markKeyed(); }
  });
  function approvalsInto(box, list) {
    // rebuild only when the set of requests changes, so a click in progress is not thrown away
    const ids = list.map((a) => a.id).join(',');
    if (box.dataset.ids === ids) {
      for (const a of list) { const n = box.querySelector('[data-id="' + a.id + '"] .left'); if (n) n.textContent = t('left', { n: secsLeft(a) }); }
      return;
    }
    box.dataset.ids = ids;
    box.replaceChildren();
    for (const a of list) {
      const card = el('div', 'approval');
      card.dataset.id = a.id;
      const main = el('div');
      const who = el('div', 'who');
      const name = str(lang === 'ko' && a.nickKo || a.nick) || str(a.session) || '?';
      const kind = a.questions ? 'question' : a.plan ? 'plan' : 'tool';
      who.append(el('span', 'ask', kind === 'question' ? t('questionKind') : kind === 'plan' ? t('planKind') : t('askTitle')));
      if (a.session) {
        // the same robot as on the agent's card, so it can be matched at a glance
        const agent = el('button', 'agent');
        agent.type = 'button';
        agent.append(robotNode(str(a.session), 'working', !!a.isLeader, true), el('b', null, name));
        if (a.short) agent.append(el('span', 'sh', str(a.short)));
        if (a.project) agent.addEventListener('click', () => select(str(a.project)));
        who.append(agent);
        if (a.project) who.append(el('span', 'proj', str(a.project)));
      } else {
        who.append(el('b', null, t('unknownAgent')));
      }
      who.append(el('span', 'proj', str(a.tool)), ...(a.managed ? [] : [el('span', 'left', t('left', { n: secsLeft(a) }))]));
      main.append(who);
      if (a.about) main.append(el('div', 'about', str(a.about)));
      if (a.what) main.append(el('div', 'what', str(a.what)));
      if (a.code) main.append(el('pre', null, str(a.code)));
      if (a.plan) main.append(el('pre', 'plan', str(a.plan)));
      // one entry per question: the picked labels plus any typed answer
      const picks = [];
      const qBoxes = [];   // for the keyboard: each question's options, and whether it takes several
      if (a.questions) {
        const qs = el('div', 'qs');
        a.questions.forEach((q, qi) => {
          const pick = { labels: new Set(), other: null };
          picks.push(pick);
          const box = el('div', 'q');
          const qh = el('div', 'qh');
          if (q.header) qh.append(el('span', 'chip', str(q.header)));
          qh.append(el('span', 'qt', str(q.question)));
          if (q.multiSelect) qh.append(el('span', 'multi', t('pickMany')));
          const opts = el('div', 'opts');
          for (const o of q.options || []) {
            const b = el('button', 'opt');
            b.type = 'button';
            b.setAttribute('aria-pressed', 'false');
            b.append(document.createTextNode(str(o.label)));
            if (o.description) b.append(el('small', null, str(o.description)));
            b.addEventListener('click', () => {
              const on = !pick.labels.has(o.label);
              if (!q.multiSelect) { pick.labels.clear(); for (const x of opts.children) x.setAttribute('aria-pressed', 'false'); }
              if (on) pick.labels.add(o.label); else pick.labels.delete(o.label);
              b.setAttribute('aria-pressed', String(on));
            });
            opts.append(b);
          }
          const other = document.createElement('input');
          other.className = 'other';
          other.placeholder = t('otherPh');
          other.setAttribute('aria-label', t('otherPh'));
          pick.other = other;
          qBoxes.push({ box, opts, multi: !!q.multiSelect });
          box.append(qh, opts, other);
          qs.append(box);
        });
        main.append(qs);
      }
      const collect = () => picks.map((p, i) => {
        const parts = [...p.labels];
        if (p.other && p.other.value.trim()) parts.push(p.other.value.trim());
        return { i, value: parts.join(', ') };
      });
      const acts = el('div', 'acts');
      const btn = (cls, label, answer, pick, getAnswers) => {
        const b = el('button', cls, label);
        b.type = 'button';
        b.addEventListener('click', async () => {
          const answers = getAnswers ? getAnswers() : undefined;
          if (answers && answers.some((x) => !x.value)) {
            let w = acts.querySelector('.warn');
            if (!w) { w = el('div', 'warn'); acts.prepend(w); }
            w.textContent = t('needAnswers');
            return;
          }
          for (const x of acts.querySelectorAll('button')) x.disabled = true;
          const send = () => fetch('/api/decide', { method: 'POST', headers: { 'content-type': 'application/json', 'x-monitor-token': token }, body: JSON.stringify({ id: a.id, answer, pick, answers }) });
          let status = 0;
          try {
            let r = await send();
            if (r.status === 403) { await refreshToken(); r = await send(); }   // the server restarted since this page loaded
            status = r.status;
          } catch (e) { status = 0; }
          // say what happened right on the card, then let the next poll clear it
          const done = el('div', 'done ' + (status === 200 ? 'ok' : 'bad'),
            status === 200 ? t(kind === 'plan' && answer === 'allow' ? 'didPlan' : kind === 'plan' && answer === 'deny' ? 'didKeep' : { allow: 'didAllow', always: 'didAlways', deny: 'didDeny', stop: 'didStop', answers: 'didAnswer' }[answer] || 'didEditor') : status === 404 ? t('gone') : t('failed'));
          acts.replaceChildren(done);
          clearTimeout(timer); timer = setTimeout(tick, 1200);
        });
        return b;
      };
      if (kind === 'question') {
        acts.append(btn('allow', t('sendAnswers'), 'answers', undefined, collect));
        if (!a.managed) acts.append(btn('', t('inEditor'), 'editor'));
      } else if (kind === 'plan') {
        acts.append(btn('allow', t('approvePlan'), 'allow'), btn('deny', t('keepPlanning'), 'deny'));
        if (!a.managed) acts.append(btn('', t('inEditor'), 'editor'));
      } else acts.append(btn('allow', t('allow'), 'allow'));
      // the same "yes, and don't ask again for …" choices VS Code would offer
      (kind === 'tool' && Array.isArray(a.options) ? a.options : []).forEach((label, i) => {
        const b = btn('always', t('always', { x: str(label) }), 'always', i);
        b.title = str(label);
        acts.append(b);
      });
      if (kind === 'tool') { acts.append(btn('deny', t('deny'), 'deny'), btn('deny', t('stop'), 'stop')); if (!a.managed) acts.append(btn('', t('inEditor'), 'editor')); }
      // number keys, the way VS Code's own prompt takes them; the badges show only on the card the keys go to
      const kbd = (b, k) => b.prepend(el('kbd', null, k));
      if (kind === 'question') {
        let qi = 0;
        const setQ = (i) => { qi = i; qBoxes.forEach((x, j) => x.box.classList.toggle('on', j === i && qBoxes.length > 1)); };
        setQ(0);
        for (const x of qBoxes) [...x.opts.children].slice(0, 9).forEach((b, i) => kbd(b, String(i + 1)));
        const sendBtn = acts.querySelector('button.allow');
        kbd(sendBtn, 'Enter');
        card.keys = {
          pick(n) {
            const x = qBoxes[qi], b = x && x.opts.children[n];
            if (!b) return false;
            b.click();
            if (!x.multi && b.getAttribute('aria-pressed') === 'true' && qi < qBoxes.length - 1) setQ(qi + 1);
            return true;
          },
          move(d) { if (qBoxes.length < 2) return false; setQ(Math.min(qBoxes.length - 1, Math.max(0, qi + d))); return true; },
          send() { if (sendBtn.disabled) return false; sendBtn.click(); return true; },
        };
      } else {
        const list = [...acts.querySelectorAll('button')].slice(0, 9);
        list.forEach((b, i) => kbd(b, String(i + 1)));
        card.keys = { pick(n) { const b = list[n]; if (!b || b.disabled) return false; b.click(); return true; } };
      }
      card.append(main, acts, el('div', 'keys', t(kind !== 'question' ? 'keysTool' : qBoxes.length > 1 ? 'keysQs' : 'keysQ')));
      box.append(card);
    }
  }

  function render(data) {
    looks.clear();
    for (const p of data.projects || []) for (const x of p.sessions) if (x.avatar) looks.set(x.name, x.avatar);
    approvalsNode(data);
    last = data;
    const all = data.projects.flatMap((p) => p.sessions);
    const n = (st) => all.filter((s) => s.state === st).length;
    const totals = $('totals');
    totals.replaceChildren();
    const pill = (cls, g, label, v) => { const x = el('span', 'pill ' + cls); x.append(el('span', 'g', g), document.createTextNode(label + ' '), el('b', null, String(v))); return x; };
    totals.append(pill('', '◆', t('projects'), data.projects.length), pill('', '●', t('sessions'), all.length), pill('run', '▶', t('working'), n('working')), pill('wait', '○', t('waiting'), n('waiting')), pill('rest', '–', t('resting'), n('resting')));

    if (selected !== ALL && !data.projects.some((p) => p.key === selected)) selected = ALL;
    const tabs = $('tabs');
    // the tabs are rebuilt on every poll — keep keyboard focus on the same tab
    const focusedTab = tabs.contains(document.activeElement) ? document.activeElement.dataset.key : null;
    tabs.replaceChildren();
    {
      // the "all agents" tab comes first
      const tab = el('button', 'tab');
      tab.type = 'button';
      tab.dataset.key = ALL;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(selected === ALL));
      tab.tabIndex = selected === ALL ? 0 : -1;
      tab.append(el('span', 'all-ico', '◆'), el('span', 'tname all', t('allTab')));
      const tc = el('span', 'tc');
      if (n('working')) tc.append(el('span', 'r', '▶ ' + n('working')));
      if (n('waiting')) tc.append(el('span', 'w', '○ ' + n('waiting')));
      if (!n('working') && !n('waiting')) tc.append(el('span', 'z', '– ' + n('resting')));
      const allAsks = (data.approvals || []).length + (data.inEditor || []).length;
      if (allAsks) tc.prepend(el('span', 'a', '! ' + allAsks));
      tab.append(tc);
      tab.addEventListener('click', () => select(ALL));
      tabs.append(tab);
    }
    for (const p of data.projects) {
      const tab = el('button', 'tab');
      tab.type = 'button';
      tab.dataset.key = p.key;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(p.key === selected));
      tab.tabIndex = p.key === selected ? 0 : -1;
      const lead = p.sessions.find((s) => s.isLeader) || p.sessions[0];
      const mood = p.counts.working ? 'working' : p.counts.waiting ? 'waiting' : 'resting';
      tab.append(robotNode(lead ? str(lead.name) : p.key, mood, !!(lead && lead.isLeader), true), el('span', 'tname', p.key));
      const tc = el('span', 'tc');
      if (p.counts.working) tc.append(el('span', 'r', '▶ ' + p.counts.working));
      if (p.counts.waiting) tc.append(el('span', 'w', '○ ' + p.counts.waiting));
      if (!p.counts.working && !p.counts.waiting) tc.append(el('span', 'z', '– ' + p.counts.resting));
      const asks = (data.approvals || []).filter((a) => a.project === p.key).length + (data.inEditor || []).filter((w) => w.project === p.key).length;
      if (asks) tc.prepend(el('span', 'a', '! ' + asks));
      tab.append(tc);
      tab.addEventListener('click', () => select(p.key));
      tabs.append(tab);
    }
    if (focusedTab != null) [...tabs.children].find((b) => b.dataset.key === focusedTab)?.focus();

    // re-rendering every few seconds must not throw away the chat scroll position
    const feedTop = box0Key === selected ? (document.querySelector('.feed')?.scrollTop || 0) : 0;
    box0Key = selected;
    const box = $('projects');
    const cur = data.projects.find((p) => p.key === selected);
    const keep = box0Key === selected ? box.querySelector('.kanban [data-editing]')?.closest('.kanban') : null;
    box.replaceChildren(...(selected === ALL ? (data.projects.length ? [allNode(data)] : []) : cur ? [projectNode(cur)] : []));
    if (!data.projects.length) box.append(el('div', 'notice', t('noSessions')));
    if (keep) box.querySelector('.kanban')?.replaceWith(keep);
    const feed = document.querySelector('.feed'); if (feed) feed.scrollTop = feedTop;

    const d = new Date(data.now), p2 = (x) => String(x).padStart(2, '0');
    $('asof').textContent = t('updated', { t: p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) });
  }

  function setLive(on) { $('live').classList.toggle('on', on); $('live-text').textContent = on ? t('live') : t('offline'); }
  function notice(msg) { const n = $('notice'); n.textContent = msg; n.hidden = !msg; }

  for (const b of document.querySelectorAll('#lang button')) b.addEventListener('click', () => setLang(b.dataset.lang));
  // ← → Home End move between project tabs
  $('tabs').addEventListener('keydown', (e) => {
    const list = [...$('tabs').children], i = list.indexOf(document.activeElement);
    if (i < 0) return;
    const j = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: list.length - 1 }[e.key];
    if (j == null) return;
    e.preventDefault();
    const next = list[(j + list.length) % list.length];
    select(next.dataset.key);
    [...$('tabs').children].find((b) => b.dataset.key === next.dataset.key)?.focus();
  });
  $('logo').append(robotNode('leader', 'working', true, false));
  // the head-only robot is wider than tall; a square viewBox keeps it full size in the tab
  $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(robotSvg('leader', 'working', true, true).replace('viewBox="1 0 62 46"', 'viewBox="1 -8 62 62"'));
  function bell() {
    const b = $('bell');
    const can = window.Notification && Notification.permission === 'default';
    b.hidden = !can;
    b.textContent = '🔔 ' + t('notifyOn');
  }
  $('acct-btn').addEventListener('click', showAccount);
  $('bell').addEventListener('click', async () => { try { await Notification.requestPermission(); } catch (e) {} bell(); });
  bell();
  applyStatic();

  let timer = null, lastSig = '', lastDraw = 0;
  async function refreshToken() {
    try { const d = await (await fetch('/api/state?visible=1', { cache: 'no-store' })).json(); if (d.token) token = d.token; } catch (e) {}
  }
  async function tick() {
    try {
      const r = await fetch('/api/state?visible=' + (document.hidden ? 0 : 1), { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      const data = await r.json();
      if (data.token) token = data.token;
      // nothing changed: leave the page as it is (redrawn every 30 s anyway, for the relative times,
      // and every time while a request's countdown runs)
      const sig = JSON.stringify({ ...data, now: 0, token: '', hooks: null });
      if (sig !== lastSig || (data.approvals || []).length || Date.now() - lastDraw > 30000) { lastSig = sig; lastDraw = Date.now(); render(data); }
      else last = data;
      alertAsks(data);
      setLive(true); notice('');
    } catch (e) {
      setLive(false); notice(t('noServer'));
    }
    timer = setTimeout(tick, document.hidden ? POLL_MS * 5 : (last?.approvals?.length ? FAST_MS : POLL_MS));
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); tick(); } });
  try {
    const es = new EventSource('/api/events');
    es.addEventListener('changed', () => { clearTimeout(timer); tick(); });
  } catch (e) {}

  // while the tab is in the background, say so in its title — and on the desktop if notifications are allowed
  let seenAsks = new Set();
  function alertAsks(data) {
    const list = data.approvals || [];
    const count = list.length + (data.inEditor || []).length;
    document.title = (count ? '(!' + count + ') ' : '') + t('title');
    const fresh = list.filter((a) => !seenAsks.has(a.id));
    seenAsks = new Set(list.map((a) => a.id));
    if (!fresh.length || !document.hidden) return;
    try {
      if (window.Notification && Notification.permission === 'granted') {
        for (const a of fresh) {
          const n = new Notification(t('askTitle') + ' · ' + (str(lang === 'ko' && a.nickKo || a.nick) || str(a.session)), { body: str(a.tool) + (a.what ? ' — ' + str(a.what) : ''), tag: a.id });
          n.onclick = () => { window.focus(); n.close(); };
        }
      }
    } catch (e) {}
  }
  tick();
})();
</script>
</body>
</html>
