<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ELOP Crew</title>
<style>
/* The window's title strip: its own view above the page, so zooming the page never touches it. */
:root{--bg:#ffffff;--line:#e0e3ea;--muted:#5b6372;--text:#171a21;--hover:#f2f3f7;--wait:#8c6a10;--wait-soft:#f7f0dc;--block:#b0341f;--block-soft:#fae8e3}
@media (prefers-color-scheme: dark){:root{--bg:#171b22;--line:#2a303b;--muted:#a3abb8;--text:#e8eaef;--hover:#232830;--wait:#e0bc5e;--wait-soft:#2f2816;--block:#f0907d;--block-soft:#3b201b}}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;gap:10px;padding:0 150px 0 10px;border-bottom:1px solid var(--line);box-sizing:border-box;
  font:700 12px system-ui,"Segoe UI",sans-serif;color:var(--muted);-webkit-app-region:drag;user-select:none}
.name{display:flex;align-items:center;gap:6px}
.name img{width:20px;height:20px}
.bar{display:flex;align-items:center;gap:1px;-webkit-app-region:no-drag}
button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 14px system-ui,"Segoe UI",sans-serif;width:28px;height:26px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
button:hover:not(:disabled){background:var(--hover);color:var(--text)}
button:disabled{opacity:.3;cursor:default}
button.pct{width:auto;padding:0 6px;font:700 11.5px ui-monospace,Consolas,monospace}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px}
/* the plan's limits: yellow past 80 %, red past 95 % */
button.usage{width:auto;padding:0 9px;height:22px;border:1px solid var(--line);border-radius:999px;font:700 11.5px system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-app-region:no-drag}
button.usage.warn{color:var(--wait);border-color:var(--wait);background:var(--wait-soft)}
button.usage.full{color:var(--block);border-color:var(--block);background:var(--block-soft)}
button.usage[hidden]{display:none}
/* macOS: the traffic lights sit on the left, nothing on the right */
body.mac{padding:0 10px 0 80px}
</style>
</head>
<body>
<span class="name"><img src="icon.png" alt=""> ELOP Crew</span>
<button id="usage" class="usage" hidden></button>
<div class="bar">
  <button id="back" data-tip="back">←</button>
  <button id="forward" data-tip="forward">→</button>
  <button id="reload" data-tip="reload">⟳</button>
  <span class="sep"></span>
  <button id="out" data-tip="out">−</button>
  <button id="pct" class="pct" data-tip="pct">100%</button>
  <button id="in" data-tip="in">+</button>
  <span class="sep"></span>
  <button id="settings" data-tip="settings">⚙</button>
</div>
<script>
const qs = new URLSearchParams(location.search), MAC = qs.get('platform') === 'darwin'
if (MAC) document.body.classList.add('mac')
// the strip's words, in the language picked on the page (the app passes it on); a button's name, then its keys
const TEXT = {
  ko: {
    back: '뒤로', forward: '앞으로', reload: '새로 고침', out: '축소', pct: '원래 크기', in: '확대', settings: '설정',
    session: '세션 ', week: '주간 ', limSession: '현재 세션 (5시간)', limWeekAll: '주간 · 전체 모델', limWeekScoped: '주간 · ',
    min: (m) => m + '분', hours: (h, m) => h + '시간' + (m ? ' ' + m + '분' : ''), days: (d) => d + '일', resets: (l) => l + ' 후 초기화',
    old: (m) => m + '분 전에 확인한 값', account: '누르면 계정 창을 엽니다',
  },
  en: {
    back: 'Back', forward: 'Forward', reload: 'Reload', out: 'Zoom out', pct: 'Reset zoom', in: 'Zoom in', settings: 'Settings',
    session: 'Session ', week: 'Week ', limSession: 'Current session (5 hours)', limWeekAll: 'Weekly · all models', limWeekScoped: 'Weekly · ',
    min: (m) => m + 'm', hours: (h, m) => h + 'h' + (m ? ' ' + m + 'm' : ''), days: (d) => d + 'd', resets: (l) => 'resets in ' + l,
    old: (m) => 'as checked ' + m + ' min ago', account: 'Click to open your account',
  },
}
const KEYS = MAC ? { reload: '⌘R', out: '⌘-', pct: '⌘0', in: '⌘=' } : { reload: 'F5', out: 'Ctrl+-', pct: 'Ctrl+0', in: 'Ctrl+=' }
KEYS.back = 'Alt+←'; KEYS.forward = 'Alt+→'
let lang = TEXT[qs.get('lang')] ? qs.get('lang') : 'en', lastUsage = null
const t = (key, ...a) => { const v = TEXT[lang][key]; return typeof v === 'function' ? v(...a) : v }
function words() {
  document.documentElement.lang = lang
  for (const b of document.querySelectorAll('[data-tip]')) { const k = b.dataset.tip; b.title = t(k) + (KEYS[k] ? ' (' + KEYS[k] + ')' : ''); b.setAttribute('aria-label', t(k)) }
  usage(lastUsage)
}
const app = window.monitorApp
const $ = (id) => document.getElementById(id)
const wire = { back: 'back', forward: 'forward', reload: 'reload', out: 'zoomOut', pct: 'zoomReset', in: 'zoomIn', settings: 'settings' }
for (const [id, fn] of Object.entries(wire)) $(id).addEventListener('click', () => app[fn]())
const show = (s) => { if (!s) return; $('pct').textContent = Math.round(s.zoom * 100) + '%'; $('back').disabled = !s.canBack; $('forward').disabled = !s.canForward }
app.onChange(show)
app.state().then(show)
// the session and the week, as on Claude Code's /usage; the other limits in the tooltip
const NAMES = { session: 'limSession', weekly_all: 'limWeekAll' }
const level = (x) => (x.percent >= 95 || /exceed|critical|block/.test(String(x.severity || '')) ? 2 : x.percent >= 80 || x.severity === 'warning' ? 1 : 0)
function left(at) { const ms = Date.parse(at) - Date.now(); if (!(ms > 0)) return ''; const m = Math.round(ms / 60000); return m < 60 ? t('min', m) : m < 1440 ? t('hours', Math.floor(m / 60), m % 60) : t('days', Math.floor(m / 1440)) }
function usage(u) {
  lastUsage = u
  const b = $('usage'), lim = (u && u.limits) || []
  const ses = lim.find((x) => x.kind === 'session'), week = lim.find((x) => x.kind === 'weekly_all')
  b.hidden = !ses && !week
  if (b.hidden) return
  b.textContent = [ses && t('session') + Math.round(ses.percent) + '%', week && t('week') + Math.round(week.percent) + '%'].filter(Boolean).join(' · ')
  b.className = 'usage' + ['', ' warn', ' full'][Math.max(0, ...lim.map(level))]
  // numbers the monitor could not refresh just now say how old they are
  const old = u.source !== 'live' && u.at ? '\n' + t('old', Math.max(1, Math.round((Date.now() - u.at) / 60000))) : ''
  b.title = lim.map((x) => (NAMES[x.kind] ? t(NAMES[x.kind]) : x.kind === 'weekly_scoped' ? t('limWeekScoped') + (x.model || '') : x.kind) + ' ' + Math.round(x.percent) + '%' + (left(x.resetsAt) ? ' · ' + t('resets', left(x.resetsAt)) : '')).join('\n') + old + '\n' + t('account')
}
app.onUsage(usage)
app.onLang((l) => { if (TEXT[l]) { lang = l; words() } })
$('usage').addEventListener('click', () => app.account())
words()
</script>
</body>
</html>
