<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ELOP Crew 설정</title>
<style>
:root{--bg:#f2f3f7;--surface:#ffffff;--line:#e0e3ea;--text:#171a21;--muted:#5b6372;--faint:#8d95a3;--accent:#3a63d8;--ok:#1f7a4d;--warn:#8c6a10}
@media (prefers-color-scheme: dark){:root{--bg:#0f1116;--surface:#171b22;--line:#2a303b;--text:#e8eaef;--muted:#a3abb8;--faint:#737c8a;--accent:#86a6f5;--ok:#6fcf97;--warn:#e0bc5e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 system-ui,"Segoe UI","Noto Sans KR",sans-serif}
/* the window's title strip: drag to move; Windows draws the close button on the right, macOS its traffic lights on the left */
.strip{height:36px;display:flex;align-items:center;gap:8px;padding:0 150px 0 12px;background:var(--surface);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;font-weight:700;font-size:12px;color:var(--muted)}
.strip img{width:18px;height:18px}
/* macOS: the traffic lights sit on the left */
body.mac .strip{padding:0 12px 0 80px}
main{padding:18px 20px 24px;display:grid;gap:14px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
h2{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0}
.row + .row{border-top:1px solid var(--line)}
.row .t{display:grid}
.row .t small{color:var(--faint);font-size:12px}
.path{font:12px ui-monospace,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}
.btns{display:flex;gap:6px;flex:none}
button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px 12px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
button:hover{border-color:var(--text)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.state{font-weight:700}
.state.ok{color:var(--ok)}
.state.warn{color:var(--warn)}
select{font:13px inherit;font-family:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
/* a switch */
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;cursor:pointer}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
/* the select drawn as the page's own, as on the monitor's page: a button and a list in these colours */
.fsel{position:relative;display:inline-block}
.fsel select{display:none}
.fbtn{appearance:none;display:flex;align-items:center;gap:8px;min-width:120px;justify-content:space-between;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:5px 9px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.fbtn:hover,.fbtn[aria-expanded="true"]{border-color:var(--accent)}
.fbtn svg{width:12px;height:12px;color:var(--muted)}
.fpop{position:fixed;z-index:10;max-height:260px;overflow:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);display:grid;gap:1px}
.fopt{appearance:none;border:0;background:none;color:var(--text);text-align:left;padding:6px 26px 6px 8px;border-radius:6px;font:13px inherit;font-family:inherit;cursor:pointer;position:relative;white-space:nowrap}
.fopt:hover,.fopt:focus{background:var(--bg);outline:none}
.fopt[aria-selected="true"]{color:var(--accent);font-weight:700}
.fopt[aria-selected="true"]::after{content:"✓";position:absolute;right:8px}
</style>
</head>
<body>
<div class="strip"><img src="icon.png" alt=""> ELOP Crew 설정</div>
<main>
  <section>
    <h2>시작과 창</h2>
    <label class="row"><span class="t">로그인할 때 자동 시작<small>PC에 로그인하면 트레이에서 조용히 시작합니다</small></span>
      <span class="sw"><input type="checkbox" id="openAtLogin"><span></span></span></label>
    <label class="row"><span class="t">창을 닫으면 트레이로<small>끄면 창을 닫을 때 앱이 종료되고, 모니터 에이전트도 멈춥니다</small></span>
      <span class="sw"><input type="checkbox" id="closeToTray"><span></span></span></label>
    <label class="row"><span class="t">창 불러오기 단축키<small id="hotkeyHow">어디서든 눌러 창을 띄우고, 한 번 더 누르면 숨깁니다</small></span>
      <select id="hotkey"></select></label>
  </section>
  <section>
    <h2>데이터 폴더 — config.json, 작업판(boards/), 에이전트 목록</h2>
    <div class="row"><span class="path" id="dataDir">…</span>
      <span class="btns"><button id="openData">열기</button><button id="pickData">바꾸기…</button></span></div>
  </section>
  <section>
    <h2>Claude Code hook — 승인·질문 답하기, 모드 표시, 메시지 보내기</h2>
    <div class="row"><span class="t"><span class="state" id="hookState">…</span><small id="hookHow"></small></span>
      <span class="btns"><button class="primary" id="installHooks">설치/갱신</button></span></div>
  </section>
  <section>
    <h2>업데이트 — GitHub Releases</h2>
    <div class="row"><span class="t"><span class="state" id="updState">…</span><small id="updHow">켤 때와 6시간마다 확인하고, 받아 두었다가 다시 시작할 때 설치합니다</small></span>
      <span class="btns"><button id="checkUpdates">지금 확인</button><button class="primary" id="installUpdate" hidden>설치하고 다시 시작</button></span></div>
  </section>
  <section>
    <h2>정보</h2>
    <div class="row"><span class="t">버전 <span id="version"></span><small id="url"></small></span>
      <span class="btns"><button id="about">프로그램 정보</button><button id="openBrowser">브라우저에서 열기</button></span></div>
  </section>
</main>
<script>
const MAC = new URLSearchParams(location.search).get('platform') === 'darwin'
if (MAC) {
  document.body.classList.add('mac')
  // macOS has a menu bar, not a tray
  for (const n of document.querySelectorAll('small, .t')) for (const t of n.childNodes) if (t.nodeType === 3) t.textContent = t.textContent.replace('PC에 로그인하면 트레이에서', 'Mac에 로그인하면 메뉴 막대에서').replace('창을 닫으면 트레이로', '창을 닫으면 메뉴 막대로')
}
const api = window.monitorSettings
const $ = (id) => document.getElementById(id)
async function load() {
  const s = await api.get()
  $('openAtLogin').checked = s.openAtLogin
  $('closeToTray').checked = s.closeToTray
  $('dataDir').textContent = s.dataDir
  $('pickData').disabled = !s.ownServer
  $('hookState').textContent = s.hooks === 'ok' ? '설치됨' : s.hooks === 'unreadable' ? '설정 파일을 읽을 수 없음' : s.hooks === 'outdated' ? '갱신 필요 — 새 기능(쉬는 세션 깨우기, 리더 팀원 안내)이 빠져 있습니다' : '설치 안 됨'
  $('hookState').className = 'state ' + (s.hooks === 'ok' ? 'ok' : 'warn')
  $('hookHow').textContent = s.node ? 'hook은 이 PC의 Node.js로 실행됩니다' : 'Node.js가 없어서 hook은 이 앱으로 실행됩니다'
  $('version').textContent = s.version
  $('url').textContent = s.url
  const keyName = (k) => k === 'off' ? '끄기' : MAC ? k.replace('Control+', '⌃').replace('Alt+', '⌥') : k.replace('Control', 'Ctrl')
  $('hotkey').replaceChildren(...s.hotkeys.map((k) => new Option(keyName(k), k)))
  $('hotkey').value = s.hotkey
  $('hotkeyHow').textContent = s.hotkeyOk ? '어디서든 눌러 창을 띄우고, 한 번 더 누르면 숨깁니다' : keyName(s.hotkey) + '은 다른 프로그램이 쓰고 있습니다 — 다른 키를 골라 주세요'
  $('hotkeyHow').style.color = s.hotkeyOk ? '' : 'var(--warn)'
  const u = s.update
  $('updState').textContent = { dev: '개발 중인 앱은 업데이트하지 않습니다', idle: '확인 전', checking: '확인하는 중…', latest: '최신 버전입니다', none: '아직 올라온 릴리스가 없습니다', downloading: (u.version || '새 버전') + ' 받는 중… ' + (u.percent || 0) + '%', ready: u.version + ' 받음 — 다시 시작하면 적용됩니다', available: (u.version || '새 버전') + ' 나옴 — 받는 곳에서 새로 설치해 주세요', error: '확인하지 못했습니다 (인터넷이나 GitHub 연결)' }[u.status] || u.status
  $('updState').className = 'state ' + (u.status === 'ready' || u.status === 'latest' ? 'ok' : u.status === 'error' ? 'warn' : '')
  $('checkUpdates').disabled = u.status === 'dev' || u.status === 'checking' || u.status === 'downloading'
  $('installUpdate').hidden = u.status !== 'ready' && u.status !== 'available'
  $('installUpdate').textContent = u.status === 'available' ? '받으러 가기' : '설치하고 다시 시작'
  $('updHow').textContent = MAC ? '켤 때와 6시간마다 확인하고, 새 버전이 나오면 알려 줍니다' : '켤 때와 6시간마다 확인하고, 받아 두었다가 다시 시작할 때 설치합니다'
}
$('openAtLogin').addEventListener('change', (e) => api.set('openAtLogin', e.target.checked).then(load))
$('closeToTray').addEventListener('change', (e) => api.set('closeToTray', e.target.checked).then(load))
$('openData').addEventListener('click', () => api.do('openData'))
$('pickData').addEventListener('click', () => api.do('pickData').then(load))
$('installHooks').addEventListener('click', () => api.do('installHooks').then(load))
$('openBrowser').addEventListener('click', () => api.do('openBrowser'))
$('about').addEventListener('click', () => api.do('about'))
$('hotkey').addEventListener('change', (e) => api.set('hotkey', e.target.value).then(load))
$('checkUpdates').addEventListener('click', () => api.do('checkUpdates').then(load))
$('installUpdate').addEventListener('click', () => api.do('installUpdate'))
api.onChange(load)
// the hotkey list drawn as the page's own (as fancySelect on the monitor's page): the real select stays, hidden, for
// its value and its 'change'
;(function fancy(sel) {
  const VALUE = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value')
  const wrap = document.createElement('span'); wrap.className = 'fsel'
  sel.replaceWith(wrap)
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fbtn'; btn.setAttribute('aria-haspopup', 'listbox')
  const label = document.createElement('span')
  btn.append(label)
  btn.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>')
  wrap.append(btn, sel)
  const draw = () => { label.textContent = sel.selectedOptions[0]?.textContent || '' }
  Object.defineProperty(sel, 'value', { configurable: true, get() { return VALUE.get.call(sel) }, set(v) { VALUE.set.call(sel, v); draw() } })
  new MutationObserver(draw).observe(sel, { childList: true, subtree: true })
  let pop = null
  const close = () => { if (!pop) return; pop.remove(); pop = null; btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('mousedown', outside, true) }
  const outside = (e) => { if (pop && !pop.contains(e.target) && !btn.contains(e.target)) close() }
  function open() {
    pop = document.createElement('div'); pop.className = 'fpop'; pop.setAttribute('role', 'listbox')
    const items = [...sel.options].map((o) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'fopt'; b.textContent = o.textContent
      b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(o.selected))
      b.addEventListener('click', () => { if (o.value !== VALUE.get.call(sel)) { VALUE.set.call(sel, o.value); draw(); sel.dispatchEvent(new Event('change', { bubbles: true })) } close(); btn.focus() })
      pop.append(b); return b
    })
    document.body.append(pop)
    const r = btn.getBoundingClientRect(), h = pop.offsetHeight
    pop.style.minWidth = r.width + 'px'
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px'
    pop.style.top = (r.bottom + 4 + h > innerHeight && r.top > h + 8 ? r.top - h - 4 : r.bottom + 4) + 'px'
    btn.setAttribute('aria-expanded', 'true')
    document.addEventListener('mousedown', outside, true)
    pop.addEventListener('keydown', (e) => {
      const i = items.indexOf(document.activeElement)
      if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, i + 1)]?.focus() }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(0, i - 1)]?.focus() }
      else if (e.key === 'Escape') { e.preventDefault(); close(); btn.focus() }
      else if (e.key === 'Tab') close()
    })
    ;(items.find((b) => b.getAttribute('aria-selected') === 'true') || items[0])?.focus()
  }
  btn.addEventListener('click', () => (pop ? close() : open()))
  btn.addEventListener('keydown', (e) => { if (!pop && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); open() } })
  draw()
})($('hotkey'))
load()
</script>
</body>
</html>
